// Enter inside the apartment-search field must pick the top match, not submit the booking form
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.dataset.action !== "apt-combo-search") return;
  e.preventDefault();
  const first = e.target.closest("[data-combo]").querySelector(".combo-opt");
  if (first) first.click();
});

document.addEventListener("change", e => {
  const el = e.target;
  const f = el.dataset.field;
  if (!f) return;

  if (f === "tax_paying_guest_count") persistBooking(el.dataset.id, { tax_paying_guest_count: Math.max(0, +el.value || 0) });
  else if (f === "actual_deposit_taken") persistBooking(el.dataset.id, { actual_deposit_taken: Math.max(0, +el.value || 0) });
  else if (f === "notes") persistBooking(el.dataset.id, { notes: el.value });
  else if (f === "apt-status") {
    const apt = aptById(el.dataset.id);
    if (apt) { apt.status = el.value; saveDB(db); render(); }
  }
});

document.addEventListener("submit", e => {
  const form = e.target;
  if (form.dataset.form === "login") {
    e.preventDefault();
    const fd = new FormData(form);
    const u = String(fd.get("username")).trim().toLowerCase();
    const p = String(fd.get("password"));
    const acc = ACCOUNTS.find(x => x.username === u && x.password === p);
    if (!acc) { form.querySelector(".err").textContent = "Wrong username or password."; return; }
    session = { username: acc.username, name: acc.name, role: acc.role };
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
    const wz = acc.role === "worker" ? workerZone(acc.username) : null;
    if (wz) activeZone = wz;
    render();
  } else if (form.dataset.form === "new-user" && e.submitter?.value === "ok") {
    const username = String(new FormData(form).get("username") || "").trim().toLowerCase();
    const taken = !username || ACCOUNTS.some(x => x.username === username);
    if (taken) {
      e.preventDefault();
      form.querySelector(".err").textContent = username ? "That username is already taken." : "Username is required.";
    }
  } else if (form.dataset.form === "booking" && e.submitter?.value === "ok") {
    // the apartment picker is a custom combobox (hidden input) — validate it here
    if (!new FormData(form).get("apartmentId")) {
      e.preventDefault();
      form.querySelector(".err").textContent = "Please choose an apartment.";
    }
  } else if (form.dataset.form === "apartment" && e.submitter?.value === "ok") {
    // native `required` is dropped from #address once the Places widget mounts — re-check here
    if (!String(new FormData(form).get("address") || "").trim()) {
      e.preventDefault();
      form.querySelector(".err").textContent = "Address is required.";
    }
  }
});

// dialog result
dlg.addEventListener("close", () => {
  const form = dlg.querySelector("form");
  if (dlg.returnValue !== "ok" || !form) return;
  const fd = new FormData(form);
  const num = (k, d = 0) => { const n = Number(fd.get(k)); return Number.isFinite(n) ? n : d; };

  if (form.dataset.form === "booking") {
    db.bookings.push({
      id: nextId(),
      apartmentId: fd.get("apartmentId"),
      guest_name: String(fd.get("guest_name")).trim(),
      guest_phone: String(fd.get("guest_phone")).trim(),
      booking_source: fd.get("booking_source"),
      agency_name: fd.get("booking_source") === "Agency" ? String(fd.get("agency_name") || "").trim() : "",
      guest_count: Math.max(1, num("guest_count", 1)),
      tax_paying_guest_count: Math.max(0, num("tax_paying_guest_count", 0)),
      arrival_date: fd.get("arrival_date"),
      departure_date: fd.get("departure_date"),
      actual_deposit_taken: Math.max(0, num("actual_deposit_taken", 0)),
      notes: String(fd.get("notes") || "").trim(),
      arrived: false, departed: false,
    });
  } else if (form.dataset.form === "apartment") {
    const patch = {
      name: String(fd.get("name")).trim(),
      address: String(fd.get("address")).trim(),
      town: String(fd.get("town") || "Novalja").trim(),
      zone: Math.min(3, Math.max(1, num("zone", 1))),
      max_guests: Math.max(1, num("max_guests", 2)),
      deposit_per_person: Math.max(0, num("deposit_per_person", 15)),
      status: fd.get("status") || "ready",
    };
    // optional coords from Google Places — only written when actually set (never clobbers)
    const latRaw = String(fd.get("lat") || "").trim(), lngRaw = String(fd.get("lng") || "").trim();
    if (latRaw && Number.isFinite(+latRaw)) patch.lat = +latRaw;
    if (lngRaw && Number.isFinite(+lngRaw)) patch.lng = +lngRaw;
    const existing = form.dataset.id && aptById(form.dataset.id);
    if (existing) Object.assign(existing, patch);
    else db.apartments.push({ id: nextId(), ...patch });
  } else if (form.dataset.form === "confirm-delete-apt") {
    db.bookings = db.bookings.filter(b => b.apartmentId !== form.dataset.id);
    db.apartments = db.apartments.filter(a => a.id !== form.dataset.id);
    openApts.delete(form.dataset.id);
  } else if (form.dataset.form === "confirm-clean") {
    const apt = aptById(form.dataset.id);
    if (apt && apt.status === "cleaning") {
      recordAction(apt, "cleaned", apt.status);
      apt.status = "ready";
      toastWithUndo(`${apt.name} marked clean`, "apt", apt.id);
    }
  } else if (form.dataset.form === "confirm-terminate") {
    const b = db.bookings.find(x => x.id === form.dataset.id);
    if (b) {
      b.status = "terminated";
      const apt = aptById(b.apartmentId);
      // no one stayed → back to ready, not cleaning; leave alone if another live booking holds it
      const otherActive = db.bookings.some(x =>
        x.apartmentId === b.apartmentId && x.id !== b.id && x.arrived && !x.departed && x.status !== "terminated");
      if (apt && apt.status === "occupied" && !otherActive) apt.status = "ready";
    }
  } else if (form.dataset.form === "templates") {
    db.templates = {};
    for (const k of Object.keys(DEFAULT_TEMPLATES))
      db.templates[k] = String(fd.get(k) || "").trim() || DEFAULT_TEMPLATES[k];
  } else if (form.dataset.form === "confirm-arrived") {
    const b = db.bookings.find(x => x.id === form.dataset.id);
    if (b) {
      const apt = aptById(b.apartmentId);
      recordAction(b, "arrived", apt ? apt.status : null);
      b.arrived = true;
      if (apt) apt.status = "occupied";
      toastWithUndo(`Marked ${b.guest_name} as arrived`, "booking", b.id);
    }
  } else if (form.dataset.form === "confirm-departed") {
    const b = db.bookings.find(x => x.id === form.dataset.id);
    if (b) {
      const apt = aptById(b.apartmentId);
      // don't downgrade status if a same-day turnover guest already checked in after this departure
      const stillOccupied = db.bookings.some(x => x.apartmentId === b.apartmentId && x.id !== b.id && x.arrived && !x.departed);
      recordAction(b, "departed", apt ? apt.status : null);
      b.departed = true;
      if (apt && !stillOccupied) apt.status = "cleaning";
      toastWithUndo(`Marked ${b.guest_name} as departed`, "booking", b.id);
    }
  } else if (form.dataset.form === "new-user") {
    const username = String(fd.get("username") || "").trim().toLowerCase();
    if (username && !ACCOUNTS.some(x => x.username === username)) {
      ACCOUNTS.push({
        username,
        password: String(fd.get("password") || "").trim(),
        name: String(fd.get("name") || "").trim(),
        role: fd.get("role") === "admin" ? "admin" : "worker",
      });
      saveAccounts(ACCOUNTS);
    }
  } else if (form.dataset.form === "edit-user") {
    const acc = ACCOUNTS.find(x => x.username === form.dataset.id);
    if (acc) {
      acc.name = String(fd.get("name") || "").trim() || acc.name;
      acc.password = String(fd.get("password") || "").trim() || acc.password;
      saveAccounts(ACCOUNTS);
      syncSelfSession(acc);
    }
  } else if (form.dataset.form === "confirm-promote") {
    const acc = ACCOUNTS.find(x => x.username === form.dataset.id);
    if (acc) { acc.role = "admin"; saveAccounts(ACCOUNTS); syncSelfSession(acc); }
  } else if (form.dataset.form === "confirm-demote") {
    const acc = ACCOUNTS.find(x => x.username === form.dataset.id);
    if (acc) { acc.role = "worker"; saveAccounts(ACCOUNTS); syncSelfSession(acc); }
  } else if (form.dataset.form === "sched-assign-row") {
    const [zone, rowIndex] = form.dataset.id.split("|").map(Number);
    const week = ensureScheduleWeek(scheduleWeekStart);
    if (!week.zones[zone][rowIndex]) week.zones[zone][rowIndex] = { username: "", days: {} };
    week.zones[zone][rowIndex].username = fd.get("username");
  } else if (form.dataset.form === "sched-assign-night") {
    ensureScheduleWeek(scheduleWeekStart).night[form.dataset.id] = fd.get("username") || "";
  } else if (form.dataset.form === "sched-hours") {
    const [zone, rowIndex, date] = form.dataset.id.split("|");
    const custom = String(fd.get("custom") || "").trim();
    if (custom) applyScheduleHours(+zone, +rowIndex, date, custom, false);
  } else if (form.dataset.form === "confirm-remove-sched-row") {
    const [zone, rowIndex] = form.dataset.id.split("|").map(Number);
    ensureScheduleWeek(scheduleWeekStart).zones[zone].splice(rowIndex, 1);
  }
  const dbForms = ["booking", "apartment", "confirm-delete-apt", "confirm-clean", "confirm-terminate",
    "templates", "confirm-arrived", "confirm-departed",
    "sched-assign-row", "sched-assign-night", "sched-hours", "confirm-remove-sched-row"];
  if (dbForms.includes(form.dataset.form)) saveDB(db);
  render();
});

/* ---- dialogs ---- */

function dialogShell(kind, title, body, { id, menu } = {}) {
  dlg.innerHTML = `<form method="dialog" class="dform" data-form="${kind}"${id ? ` data-id="${esc(id)}"` : ""}>
    <div class="sheet-grip" aria-hidden="true"></div>
    <h3>${title}</h3>
    ${body}
    <menu>${menu || `
      <button type="button" class="btn-ghost" data-action="dlg-cancel">Cancel</button>
      <button value="ok" class="btn">Save</button>`}
    </menu>
  </form>`;
  dlg.showModal();
  // some browsers don't clear returnValue on showModal(); without this, dismissing a
  // dialog with Escape after any previous Save would still read "ok" and re-run the action.
  dlg.returnValue = "";
}

/* --- drag-to-dismiss: grab the sheet-grip and swipe the dialog down to close it, like an
   iOS sheet. Bound once on the persistent <dialog> element (its content is swapped by
   dialogShell above, but the element itself never is) via pointer events, so it covers
   mouse, touch, and pen alike. Only active where the grip is actually visible — desktop
   dialogs are centred modals, not bottom sheets, so the grip is display:none there and
   this never engages. */
(function setupSheetDrag() {
  const DISMISS_PX = 90;
  let dragging = false, startY = 0, dragY = 0, startH = 0;

  function onDown(e) {
    const grip = e.target.closest(".sheet-grip");
    if (!grip || !dlg.open || getComputedStyle(grip).display === "none") return;
    dragging = true;
    startY = e.clientY;
    dragY = 0;
    startH = dlg.offsetHeight || 400;
    dlg.style.transition = "none";
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }
  function onMove(e) {
    if (!dragging) return;
    dragY = Math.max(0, e.clientY - startY);   // only downward
    dlg.style.transform = `translateY(${dragY}px)`;
    dlg.style.opacity = String(1 - Math.min(1, dragY / startH) * 0.35);
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    if (dragY > DISMISS_PX) {
      dlg.style.transition = "transform .22s var(--ease),opacity .22s var(--ease)";
      dlg.style.transform = `translateY(${startH}px)`;
      dlg.style.opacity = "0";
      setTimeout(() => {
        dlg.close("cancel");
        dlg.style.transition = ""; dlg.style.transform = ""; dlg.style.opacity = "";
      }, 190);
    } else {
      dlg.style.transition = "transform .3s var(--ease-pop),opacity .3s var(--ease)";
      dlg.style.transform = ""; dlg.style.opacity = "";
      setTimeout(() => { dlg.style.transition = ""; }, 300);
    }
  }
  dlg.addEventListener("pointerdown", onDown);
})();

/* ---- richer confirmations for arrived / departed / clean / terminate ---- */

function bookingSummaryRows(b, withNotes) {
  const apt = aptById(b.apartmentId) || {};
  const nights = nightsBetween(b.arrival_date, b.departure_date);
  const src = b.booking_source === "Agency" && b.agency_name ? `Agency · ${esc(b.agency_name)}` : esc(b.booking_source);
  const notes = withNotes && b.notes
    ? `<div style="margin-top:8px"><div class="metric-label">Notes</div>
         <div class="dim" style="font-size:13px;margin-top:2px">${esc(b.notes)}</div></div>` : "";
  return `<div class="card muted-card" style="margin-top:4px">
    <div class="kv"><span>Apartment</span><span>${esc(apt.name || "—")}</span></div>
    <div class="kv"><span>Address</span><span>${esc(apt.address || "—")}</span></div>
    <div class="kv"><span>Guest</span><span>${esc(b.guest_name)}</span></div>
    <div class="kv"><span>Source</span><span>${src}</span></div>
    <div class="kv"><span>Guests</span><span>${b.guest_count}</span></div>
    <div class="kv"><span>Stay</span><span>${prettyDate(b.arrival_date)} ${I.arrow} ${prettyDate(b.departure_date)} · ${nights}n</span></div>
    <div class="kv"><span>Tax-paying · tax</span><span>${b.tax_paying_guest_count} · ${eur(touristTax(b.tax_paying_guest_count, nights))}</span></div>
    <div class="kv"><span>Deposit taken</span><span>${eur0(b.actual_deposit_taken)}</span></div>
    ${notes}
  </div>`;
}

// kind: confirm-arrived | confirm-departed | confirm-clean | confirm-terminate
function openConfirmAction(kind, id) {
  let title, body, confirmLabel, danger = false;

  if (kind === "confirm-clean") {
    const a = aptById(id);
    if (!a) return;
    const dep = db.bookings
      .filter(x => x.apartmentId === id && x.departed)
      .sort((x, y) => (x.departure_date < y.departure_date ? 1 : -1))[0];
    title = "Mark apartment clean?";
    confirmLabel = "Confirm clean";
    body = `<div class="card muted-card" style="margin-top:4px">
      <div class="kv"><span>Apartment</span><span>${esc(a.name)}</span></div>
      <div class="kv"><span>Address</span><span>${esc(a.address)}</span></div>
      <div class="kv"><span>Zone</span><span>${a.zone}</span></div>
      ${dep ? `<div class="kv"><span>Last guest</span><span>${esc(dep.guest_name)}</span></div>
               <div class="kv"><span>Departed</span><span>${prettyDate(dep.departure_date)}</span></div>` : ""}
    </div>`;
  } else {
    const b = db.bookings.find(x => x.id === id);
    if (!b) return;
    if (kind === "confirm-arrived") {
      title = "Confirm arrival?"; confirmLabel = "Confirm arrival";
      body = bookingSummaryRows(b);
    } else if (kind === "confirm-departed") {
      title = "Confirm departure?"; confirmLabel = "Confirm departure";
      body = bookingSummaryRows(b, true);
    } else { // confirm-terminate
      title = "Terminate this booking?"; confirmLabel = "Terminate booking"; danger = true;
      const arrivedWarn = b.arrived && !b.departed
        ? `<p style="font-size:12px;margin-top:10px;color:var(--red);font-weight:600">This guest has already checked in — terminating frees the apartment.</p>` : "";
      body = bookingSummaryRows(b) + arrivedWarn +
        `<p class="dim" style="font-size:12px;margin-top:10px">The booking is cancelled and the apartment stays available. This can't be undone.</p>`;
    }
  }

  dialogShell(kind, title, body, {
    id,
    menu: `
      <button type="button" class="btn-ghost" data-action="dlg-cancel">Cancel</button>
      <button value="ok" class="btn ${danger ? "btn-red" : "btn-green"}">${esc(confirmLabel)}</button>`,
  });
}

function applyScheduleHours(zone, rowIndex, date, value, standalone = true) {
  const week = ensureScheduleWeek(scheduleWeekStart);
  const row = week.zones[zone][rowIndex];
  if (!row) return;
  row.days[date] = value;
  if (standalone) { saveDB(db); render(); }
}

function workerOptions(selected) {
  return ACCOUNTS.filter(a => a.role === "worker")
    .map(w => `<option value="${esc(w.username)}" ${w.username === selected ? "selected" : ""}>${esc(w.name)}</option>`).join("");
}

function openScheduleWorkerDialog(zone, rowIndex) {
  const current = getScheduleWeek(scheduleWeekStart).zones[zone][rowIndex]?.username || "";
  // for a brand-new row, force an explicit pick instead of letting the browser default to the first worker
  const placeholder = current ? "" : `<option value="" disabled selected>— Select worker —</option>`;
  dialogShell("sched-assign-row", `Zone ${zone} worker`, `
    <label class="f">Worker<select name="username" required>${placeholder}${workerOptions(current)}</select></label>
  `, { id: `${zone}|${rowIndex}` });
}

function openScheduleNightDialog(date) {
  const current = getScheduleWeek(scheduleWeekStart).night[date] || "";
  dialogShell("sched-assign-night", `Night shift — ${scheduleDayHeader(date)}`, `
    <label class="f">Worker<select name="username"><option value="">— None —</option>${workerOptions(current)}</select></label>
  `, { id: date });
}

function openScheduleHoursDialog(zone, rowIndex, date) {
  const current = getScheduleWeek(scheduleWeekStart).zones[zone][rowIndex]?.days[date] || "";
  const presets = ["8:00 - 16:00", "16:00 - 00:00", "FREE"];
  const custom = presets.includes(current) ? "" : current;
  dialogShell("sched-hours", `Hours — ${scheduleDayHeader(date)}`, `
    <div class="row2">
      <button type="button" class="btn-ghost" data-action="sched-preset" data-value="8:00 - 16:00">8:00 - 16:00</button>
      <button type="button" class="btn-ghost" data-action="sched-preset" data-value="16:00 - 00:00">16:00 - 00:00</button>
    </div>
    <button type="button" class="btn-ghost" style="width:100%;margin-top:10px" data-action="sched-preset" data-value="FREE">Free</button>
    <label class="f" style="margin-top:14px">Specific times
      <input name="custom" value="${esc(custom)}" placeholder="8:00 - 10:00 // 14:00 - 20:00"></label>
  `, { id: `${zone}|${rowIndex}|${date}` });
}

/* ---- theme ---- */

function toggleTheme() {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  render();
}
(function initTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
})();

// use the embedded logo as the browser tab / bookmark favicon too
(function setFavicon() {
  const link = document.createElement("link");
  link.rel = "icon"; link.type = "image/png"; link.href = LOGO_SRC;
  document.head.appendChild(link);
})();

/* ========================================================================
   SELF-CHECK  (runs once at startup; logs to console)
   ===================================================================== */

(function selfTest() {
  const ok = (cond, label) => (cond ? console.log("%c✓ " + label, "color:#12b981")
                                     : console.error("✗ " + label));
  const near = (a, b) => Math.abs(a - b) < 1e-9;
  ok(nightsBetween("2026-09-08", "2026-09-11") === 3, "nights: 8→11 Sep = 3");
  ok(nightsBetween("2026-09-08", "2026-09-08") === 0, "nights: same day = 0");
  ok(near(touristTax(3, 4), 19.2), "tax: 3 pax × 4 nights = €19.20");
  ok(touristTax(0, 5) === 0, "tax: 0 tax-paying guests = €0");
  ok(eur(touristTax(3, 4)) === "€19.20", "tax formats to €19.20");
  ok(recDeposit({ deposit_per_person: 15 }, { guest_count: 4 }) === 60, "deposit: €15 × 4 = €60");
  ok(fillTemplate("Hi {guest}, checkout at {time}.", { guest: "Luka", time: "9:00" })
     === "Hi Luka, checkout at 9:00.", "template: fills {guest} and {time}");
  ok(fillTemplate("Keep {unknown}", {}) === "Keep {unknown}", "template: leaves unknown tokens intact");

  // Feature 3 — three template kinds, no reminder anywhere, every token substitutable
  ok(!("checkoutReminder" in DEFAULT_TEMPLATES) && Object.keys(DEFAULT_TEMPLATES).join() === "checkin,checkout,review"
     && !("checkoutReminder" in TEMPLATE_LABELS), "templates: only checkin/checkout/review remain");
  {
    const m = buildMessage("review", { guest_name: "Ana Perić" }, { name: "Sea Breeze Studio", town: "Novalja" });
    ok(m.includes("Ana Perić") && m.includes("Sea Breeze Studio") && !m.includes("{"),
       "buildMessage('review'): review template, all tokens filled");
    ok(DEFAULT_TEMPLATES.checkout.includes("{time}") && DEFAULT_TEMPLATES.checkout.toLowerCase().includes("rubbish"),
       "default check-out template folds in the checkout-day reminder");
  }

  // Feature 2 — lifecycle phase derivation
  ok(bookingPhase({ status: "terminated", arrival_date: "2020-01-01", departure_date: "2020-01-02" }) === "terminated",
     "phase: terminated wins");
  ok(bookingPhase({ arrival_date: addDays(todayStr(), 3), departure_date: addDays(todayStr(), 6) }) === "upcoming",
     "phase: future booking = upcoming");
  ok(bookingPhase({ departed: true, arrival_date: addDays(todayStr(), -5), departure_date: addDays(todayStr(), -1) }) === "past",
     "phase: departed = past");
  ok(bookingPhase({ arrived: true, departed: false, arrival_date: addDays(todayStr(), -1), departure_date: addDays(todayStr(), 2) }) === "current",
     "phase: staying now = current");

  // Feature 1 — undo helpers revert the last action and restore prior apartment status
  {
    const apt = { status: "occupied", _history: [] };
    const bk = { arrived: true, departed: false, _history: [{ a: "arrived", at: 1, by: "X", prev: "ready" }] };
    ok(revertBookingAction(bk, apt) && bk.arrived === false && apt.status === "ready" && bk._history.length === 0,
       "undo arrival: flips arrived + restores apt status");
    const apt2 = { status: "ready", _history: [{ a: "cleaned", at: 1, by: "X", prev: "cleaning" }] };
    ok(revertAptClean(apt2) && apt2.status === "cleaning" && apt2._history.length === 0,
       "undo clean: apartment back to cleaning");
    ok(revertBookingAction({ _history: [] }, {}) === false, "undo: no-op when no history");
    // recordAction keeps only a short tail
    const cap = { _history: [] };
    for (let i = 0; i < 20; i++) recordAction(cap, "cleaned", "cleaning");
    ok(cap._history.length === 8, "recordAction: _history capped at 8 entries");
    // aptCleanUndoable: only while apt is still 'ready' with a trailing 'cleaned'
    ok(aptCleanUndoable({ status: "ready", _history: [{ a: "cleaned" }] }) === true, "aptCleanUndoable: ready + cleaned");
    ok(aptCleanUndoable({ status: "occupied", _history: [{ a: "cleaned" }] }) === false, "aptCleanUndoable: not once moved on");
  }

  // Fix 3 — searchable apartment picker: filters by name, groups by zone, marks selection
  {
    const s = db.apartments[0];
    if (s) {
      const html = aptComboListHtml(s.name.slice(0, 3).toLowerCase(), s.id);
      ok(html.includes(esc(s.name)) && html.includes("Zone " + s.zone) && html.includes("combo-opt sel"),
         "aptComboList: name filter + zone header + selected row");
    }
    ok(aptComboListHtml("zzz-no-such-apartment", "").includes("No apartments match"),
       "aptComboList: empty state when nothing matches");
  }
})();

render();
</script>
