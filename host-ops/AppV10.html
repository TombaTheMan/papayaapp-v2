<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a44ff">
<title>Papaya Travel</title>

     / blocked), the address field stays a plain text input — nothing breaks.

<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
:root{
  color-scheme:light dark;
  --bg:#ffffff; --surface:#f6f4fc; --surface-2:#edeafb; --card:#ffffff;
  --text:#1b1830; --dim:#6c6885; --border:#e9e5f5;
  --accent:#6a44ff; --accent-2:#5734ec; --accent-soft:#efeaff; --on-accent:#fff;
  --green:#12b981; --orange:#f6a723; --blue:#3d9bff; --red:#ef4444;
  /* darker "ink" variants used for text sitting on the pale tinted pill backgrounds below —
     the base green/orange/blue/red are tuned for solid fills and dots, and are too light to
     read as text on their own 16-18% tints (verified against WCAG 4.5:1) */
  --green-ink:#065f46; --orange-ink:#92400e; --blue-ink:#1d4ed8; --red-ink:#b91c1c;
  /* floating layers (dialogs, toast, popovers) — the heavier elevation */
  --shadow:0 1px 2px rgba(20,16,45,.05), 0 10px 30px rgba(20,16,45,.06);
  /* resting surfaces (cards) — soft, tight, faintly purple-tinted */
  --shadow-card:0 1px 2px rgba(58,40,140,.05), 0 5px 16px rgba(58,40,140,.05);
  --r:18px; --r-sm:12px; --r-lg:22px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ease-pop:cubic-bezier(.34,1.56,.64,1);   /* deliberate overshoot — success/accent moments only */
  /* type scale */
  --fs-title:30px; --fs-metric:33px; --fs-headline:17px; --fs-body:16px; --fs-footnote:13px; --fs-caption:11px;
  /* gradient + glow tokens — the purple "signature" of the app */
  --grad-brand:linear-gradient(135deg,var(--accent),var(--accent-2));
  --grad-brand-2:linear-gradient(150deg,#9d7bff,var(--accent) 55%,#5a37e8);
  --glow-accent:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent);
  --aurora-1:color-mix(in srgb,var(--accent) 22%,transparent);
  --aurora-2:color-mix(in srgb,#ff8bd6 16%,transparent);
  --aurora-3:color-mix(in srgb,var(--blue) 14%,transparent);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#141320; --surface-2:#1e1c2b; --card:#161520;
    --text:#f4f2fb; --dim:#9b97ad; --border:#2b2838;
    --accent:#8f74ff; --accent-2:#7e61f5; --accent-soft:#241f3d;
    --green:#1fc98d; --orange:#ffb43d; --blue:#4ea6ff; --red:#f87171;
    /* on dark tinted pill backgrounds the bright tokens already clear 4.5:1, so ink = base */
    --green-ink:#1fc98d; --orange-ink:#ffb43d; --blue-ink:#4ea6ff; --red-ink:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.55);
    --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4);
    --aurora-1:color-mix(in srgb,var(--accent) 30%,transparent);
    --aurora-2:color-mix(in srgb,#ff6fd8 20%,transparent);
    --aurora-3:color-mix(in srgb,var(--blue) 20%,transparent);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#141320; --surface-2:#1e1c2b; --card:#161520;
  --text:#f4f2fb; --dim:#9b97ad; --border:#2b2838;
  --accent:#8f74ff; --accent-2:#7e61f5; --accent-soft:#241f3d;
  --green:#1fc98d; --orange:#ffb43d; --blue:#4ea6ff; --red:#f87171;
  --green-ink:#1fc98d; --orange-ink:#ffb43d; --blue-ink:#4ea6ff; --red-ink:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.55);
  --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4);
  --aurora-1:color-mix(in srgb,var(--accent) 30%,transparent);
  --aurora-2:color-mix(in srgb,#ff6fd8 20%,transparent);
  --aurora-3:color-mix(in srgb,var(--blue) 20%,transparent);
}
html,body{background:var(--bg);color:var(--text)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;position:relative}
/* --- aurora mesh: soft purple glow fixed behind everything, shows through the blurred chrome --- */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px circle at 12% -8%, var(--aurora-1), transparent 60%),
    radial-gradient(560px circle at 108% 12%, var(--aurora-2), transparent 55%),
    radial-gradient(680px circle at 50% 115%, var(--aurora-3), transparent 60%);
  animation:aurora-drift 26s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes aurora-drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(-2%,2%,0) scale(1.06)}
}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:100px;position:relative;z-index:1}
h2{font-size:var(--fs-title);font-weight:700;letter-spacing:-.022em;line-height:1.15;margin:2px 0}
h3{font-size:var(--fs-headline);font-weight:600;letter-spacing:-.012em;margin-bottom:12px}
small,.dim{color:var(--dim)}
/* de-emphasise with weight, not only colour — reads calmer than a colour-only shift */
.sub{font-weight:400;color:var(--dim)}
button{font:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}

/* --- chrome --- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--border);
  view-transition-name:app-topbar;contain:layout}
@supports (backdrop-filter:blur(1px)){
  .topbar{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(20px) saturate(160%);
    border-bottom-color:color-mix(in srgb,var(--border) 55%,transparent)}
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em}
/* the logo carries its own dark wordmark, so a small light "safe area" chip keeps it
   legible in dark mode too, instead of dark-on-dark */
.brand .mark{height:28px;width:auto;display:block;border-radius:8px;background:#fff;
  padding:4px 9px;box-shadow:0 2px 8px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .3s var(--ease-pop)}
@media (hover:hover){.brand:hover .mark{transform:scale(1.05)}}
.top-actions{display:flex;align-items:center;gap:8px}
.who{font-size:13px;color:var(--dim);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- Large Title effect: the big in-content <h2.page-title> shrinks/fades as the page
   scrolls, while this compact title crossfades in, centred in the topbar. Driven by
   --scroll-p (0..1), a scroll-linked custom property set on :root — see onScroll(). --- */
.topbar-title{position:absolute;left:50%;top:50%;pointer-events:none;white-space:nowrap;
  font-weight:700;font-size:15px;letter-spacing:-.012em;
  opacity:var(--scroll-p,0);
  transform:translate(-50%,calc(-50% + (1 - var(--scroll-p,0)) * 6px))}
.page-title{opacity:calc(1 - var(--scroll-p,0));
  transform:translateY(calc(var(--scroll-p,0) * -6px)) scale(calc(1 - var(--scroll-p,0) * .06));
  transform-origin:left center}

.iconbtn{width:44px;height:44px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:11px;display:grid;place-items:center;transition:transform .12s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.iconbtn:active{transform:scale(.96)}
@media (hover:hover){.iconbtn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 18%,transparent);transform:translateY(-1px)}}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);
  view-transition-name:app-nav;contain:layout}
@supports (backdrop-filter:blur(1px)){
  .nav{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(20px) saturate(160%);
    border-top-color:color-mix(in srgb,var(--border) 55%,transparent)}
}
.nav-inner{width:100%;max-width:480px;display:flex;gap:6px;position:relative}
/* sliding gradient "pill" behind the active tab — mirrors the segmented-control thumb (see layoutNavThumb) */
.nav-thumb{position:absolute;top:0;left:0;width:0;height:100%;border-radius:12px;z-index:0;opacity:0;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent-2) 12%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 24%,transparent);pointer-events:none;
  transition:transform .42s var(--ease-pop),width .42s var(--ease-pop),height .42s var(--ease-pop),opacity .22s var(--ease)}
.nav a{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;
  color:var(--dim);font-size:11px;font-weight:600;transition:color .18s var(--ease)}
.nav a.on{color:var(--accent)}

/* --- layout --- */
main{display:block;view-transition-name:app-main}
.screen{padding:16px 16px 8px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-head{display:flex;align-items:center;gap:8px;margin:18px 2px 10px}
.section-head .count{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:999px}

@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fade{animation:fade .22s var(--ease)}

/* --- "today at a glance" hero tiles (Check in/out screen) — Apple-Health-style gradient
   cards with a small progress ring; purely additive, purely decorative summary of ins/outs --- */
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.hero-tile{position:relative;overflow:hidden;border-radius:20px;padding:16px;color:#fff;
  display:flex;flex-direction:column;min-height:104px;
  box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 24%,transparent),inset 0 1px 0 rgba(255,255,255,.16);
  animation:rowin .36s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
.hero-tile::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120px circle at 100% 0%, rgba(255,255,255,.22), transparent 60%)}
.hero-a{background:var(--grad-brand-2)}
.hero-b{background:linear-gradient(150deg,var(--accent-2),#332476 85%)}
.hero-ring{position:absolute;right:12px;top:12px;opacity:.95}
.hero-num{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:30px}
.hero-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.85;margin-top:2px}
.hero-sub{font-size:12px;font-weight:600;opacity:.8;margin-top:5px}
@media (hover:hover){
  .hero-tile{transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
  .hero-tile:hover{transform:translateY(-2px);box-shadow:0 16px 34px color-mix(in srgb,var(--accent) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
}

/* Apple cards are flatter — hairline border, no stacked elevation. Reserve the
   heavier --shadow for genuinely floating things (dialog, toast, combo-panel). */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
@media (hover:hover){
  .cardgrid > .card:hover,.stack > .card:hover{transform:translateY(-2px);
    box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 22%,var(--border))}
}
.hero-tile{cursor:default;transition:transform .18s var(--ease)}
.hero-tile:active{transform:scale(.98)}
.card + .card{margin-top:12px}
.muted-card{background:var(--surface);box-shadow:none;border-color:transparent}
/* the check-in/out action cards do float above the screen — give them the soft lift */
.cardgrid > .card{box-shadow:var(--shadow-card)}

.metric{font-size:var(--fs-metric);font-weight:700;letter-spacing:-.03em;line-height:1}
.metric-label{font-size:var(--fs-caption);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* --- boot skeleton: shown for the instant before the app's first render() runs, so a cold
   load or slow connection sees a shimmering placeholder instead of a blank white flash --- */
.skel-topbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.skel-body{padding:16px}
.skel{display:inline-block;background:linear-gradient(100deg,var(--surface) 25%,var(--surface-2) 45%,var(--surface) 65%);
  background-size:200% 100%;animation:skel-shimmer 1.5s ease-in-out infinite;border-radius:8px}
.skel-mark{width:26px;height:26px;border-radius:8px;flex:none}
.skel-line{border-radius:999px}
.skel-card{display:block;height:118px;border-radius:18px;margin-top:12px}
@keyframes skel-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* apartment name on a booking card — bold + coloured so it reads before the fine print does */
.apt-name{font-weight:800;font-size:14.5px;letter-spacing:-.012em;color:var(--accent);margin-top:2px}

.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:capitalize;white-space:nowrap;
  transition:background .25s var(--ease),color .25s var(--ease)}
.s-occupied{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-ink)}
.s-ready{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange-ink)}
.s-cleaning{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue-ink)}
.s-terminated{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red-ink)}
.s-current{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-ink)}
.s-upcoming{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue-ink)}
.s-past{background:color-mix(in srgb,var(--dim) 15%,transparent);color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-occupied{background:var(--green)} .d-ready{background:var(--orange)} .d-cleaning{background:var(--blue)} .d-terminated{background:var(--red)}

.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:600;text-align:right}

.btn{border:0;color:var(--on-accent);font-weight:600;padding:12px 16px;border-radius:15px;width:100%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent),#fff 8%),var(--accent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .12s var(--ease),background .15s,box-shadow .15s var(--ease)}
.btn:active{transform:scale(.96);background:var(--accent-2)}
/* iOS secondary button — tonal fill, no border */
.btn-ghost{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;
  padding:12px 16px;border-radius:15px;transition:transform .12s var(--ease),background .15s var(--ease)}
.btn-ghost:active{transform:scale(.96);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.btn-row{display:flex;gap:10px}

label.f{display:block;font-size:12px;color:var(--dim);font-weight:700;margin-bottom:6px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 12px;width:100%;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid transparent;outline-offset:2px;border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}   /* transparent outline -> visible in forced-colors */
.field + .field{margin-top:10px}
/* horizontal "settings row" for short single-value fields (label left, control right) */
.f-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px}
.f-row > span{font-size:12px;color:var(--dim);font-weight:700;flex:none}
.f-row > select,.f-row > input{width:auto;min-width:0;flex:1;max-width:60%;text-align:right}

/* --- live-filter search field (Apartments / All Bookings) --- */
.search-field{position:relative;display:flex;align-items:center}
.search-field .search-ic{position:absolute;left:12px;color:var(--dim);pointer-events:none;display:flex}
.search-field input{padding-left:36px;padding-right:34px;border-radius:12px;background:var(--surface-2)}
.search-field input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:8px;display:none;align-items:center;justify-content:center;
  width:24px;height:24px;border:0;background:none;color:var(--dim);border-radius:50%;
  transition:color .15s var(--ease),transform .12s var(--ease)}
.search-clear:active{transform:scale(.88)}
.search-field input:not(:placeholder-shown) ~ .search-clear{display:flex}
@media (hover:hover){.search-clear:hover{color:var(--text)}}

/* action icons on a booking */
.acts{display:flex;gap:8px}
.ico{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);color:var(--accent);transition:transform .12s var(--ease)}
.ico:active{transform:scale(.96)}
.ico[aria-disabled=true]{opacity:.4;pointer-events:none}

/* segmented control — one sliding thumb (see layoutSegThumbs), buttons sit transparent on top */
.seg{position:relative;display:flex;background:var(--surface-2);border-radius:13px;padding:4px;gap:4px}
.seg-thumb{position:absolute;left:0;top:4px;height:calc(100% - 8px);width:0;border-radius:10px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--card),#fff 6%),var(--card));
  box-shadow:var(--shadow-card),inset 0 0 0 1px color-mix(in srgb,var(--accent) 12%,transparent);
  pointer-events:none;opacity:0;
  transition:transform .34s var(--ease-pop),width .34s var(--ease-pop),opacity .2s var(--ease)}
.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:var(--dim);font-weight:600;
  padding:9px 6px;border-radius:10px;font-size:14px;transition:color .18s var(--ease)}
.seg button.on{color:var(--accent)}
.datestep{display:flex;align-items:center;gap:8px;margin-top:10px}
.datestep input{text-align:center;font-weight:600}
.step{width:44px;height:44px;flex:none;border:1px solid var(--border);background:var(--surface);border-radius:12px;
  color:var(--text);display:grid;place-items:center;transition:transform .12s var(--ease)}
.step:active{transform:scale(.96)}

/* apartment card expand */
.apt{cursor:pointer}
.apt .exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease)}
.apt.open .exp{grid-template-rows:1fr}
.apt .exp > div{overflow:hidden}
.apt .exp .inner{padding-top:14px;margin-top:12px;border-top:1px solid var(--border);
  opacity:0;transform:translateY(6px);
  transition:opacity .26s var(--ease) .06s,transform .26s var(--ease) .06s}
.apt.open .exp .inner{opacity:1;transform:none}
.chev{transition:transform .28s var(--ease-pop);color:var(--dim)}
.apt.open .chev{transform:rotate(90deg)}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  color:var(--dim);padding:34px 16px;font-size:14px;font-weight:400}
.empty-ic{line-height:0;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 15%,var(--surface)),color-mix(in srgb,var(--accent-2) 8%,var(--surface)));
  color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.empty-ic svg{width:26px;height:26px}

/* undo affordances + audit line (safer check-in/out actions) */
.stat-col{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;text-align:right;max-width:52%}
.stat-note{font-size:11px;line-height:1.35}
.undo-link{border:0;background:none;color:var(--accent);font-weight:600;font-size:11px;line-height:1.4;padding:0}
.undo-link:active{opacity:.55}
@media (hover:hover){.undo-link:hover{text-decoration:underline}}

.count-badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:3px 9px;border-radius:999px;white-space:nowrap}

/* undo toast — a floating "Dynamic Island"-style capsule, always near-black regardless of
   theme (like the real thing), that grows in from the top edge of the screen. */
#toast{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));bottom:auto;z-index:60;
  display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 28px);
  background:#141018;color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:999px;
  box-shadow:0 14px 32px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);
  padding:10px 16px 10px 14px;font-size:13.5px;font-weight:600;
  animation:island-in .42s var(--ease-pop)}
.toast > span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.toast > .toast-check{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--green) 55%,transparent);color:#fff}
.toast > .toast-check svg{width:13px;height:13px;stroke-dasharray:26;stroke-dashoffset:26;animation:draw .34s var(--ease) .12s forwards}
.toast-undo{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;
  font-size:12.5px;padding:6px 13px;border-radius:999px;transition:transform .12s var(--ease),background .15s var(--ease)}
.toast-undo:active{transform:scale(.94);background:rgba(255,255,255,.24)}
@keyframes island-in{
  0%{opacity:0;transform:translateY(-16px) scale(.4)}
  55%{opacity:1;transform:translateY(0) scale(1.04)}
  100%{transform:none}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes island-out{to{opacity:0;transform:translateY(-12px) scale(.82)}}
.toast.out{animation:island-out .18s var(--ease) forwards}
@media (min-width:1024px){#toast{top:calc(14px + env(safe-area-inset-top))}}

/* dialog / sheet */
dialog{border:0;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:480px;margin:auto auto 0;background:var(--card);color:var(--text);box-shadow:var(--shadow);
  max-height:calc(100dvh - 20px);overflow-y:auto}
dialog::backdrop{background:rgba(8,6,20,.38);backdrop-filter:blur(8px) saturate(120%)}
@media (min-width:520px){dialog{border-radius:var(--r-lg);margin:auto;max-width:520px;padding-top:22px}}
dialog[open]{animation:dlgpop .38s var(--ease-pop)}
dialog[open]::backdrop{animation:fade .24s var(--ease)}
@keyframes dlgpop{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
dialog menu{display:flex;gap:10px;margin-top:18px;padding:0}
dialog menu button{flex:1}
.dform label.f{margin-top:12px}
.dform h3{margin-bottom:4px}
/* grabber handle — the "this is a native sheet" signal */
.sheet-grip{width:36px;height:4px;border-radius:999px;background:var(--dim);opacity:.35;margin:-4px auto 12px}
@media (min-width:520px){.sheet-grip{display:none}}

/* searchable apartment picker (booking dialog) */
.combo{position:relative}
.combo-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 12px;text-align:left;transition:border-color .15s var(--ease)}
.combo-trigger:active{border-color:var(--accent)}
.combo-trigger .chev{transform:rotate(90deg);flex:none}
.combo-panel{margin-top:8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);
  box-shadow:var(--shadow);overflow:hidden}
.combo-panel .combo-search{border:0;border-bottom:1px solid var(--border);border-radius:0;background:var(--card)}
.combo-panel .combo-search:focus{outline:2px solid transparent;border-color:var(--border);box-shadow:inset 0 -2px 0 var(--accent)}
.combo-list{max-height:44vh;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.combo-group{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px}
.combo-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;
  font:inherit;color:var(--text);background:transparent;border:0;border-radius:10px;padding:8px 10px;text-align:left;
  transition:background .15s var(--ease)}
.combo-opt.sel{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.combo-opt:active{background:var(--surface-2)}
@media (hover:hover){.combo-opt:hover{background:var(--surface)}}

/* Google Places autocomplete widget — best-effort match to the .f text inputs */
gmp-place-autocomplete{display:block;width:100%;font:inherit;
  --gmp-mat-color-surface:var(--surface);--gmp-mat-color-on-surface:var(--text);
  --gmp-mat-color-on-surface-variant:var(--dim);--gmp-mat-color-outline:var(--border);
  --gmp-mat-color-primary:var(--accent)}

/* login */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login{width:100%;max-width:340px;text-align:center}
.login .mark-lg{display:block;width:auto;height:auto;max-width:220px;margin:0 auto 22px;
  background:#fff;border-radius:18px;padding:16px 22px;
  box-shadow:0 14px 32px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.6);
  animation:mark-in .5s var(--ease-pop) both}
@keyframes mark-in{from{opacity:0;transform:translateY(-8px) scale(.85)}to{opacity:1;transform:none}}
.login .field{text-align:left}
.login .btn{margin-top:16px}
.hint{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.7}
/* staggered entrance for the login form's own children */
.login > *{animation:rowin .4s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}

/* --- iOS-style bottom tab bar: no pill, icon crossfades outline -> filled --- */
.nav a.on{color:var(--accent);background:transparent}
.nav a.on span{font-weight:700}
.nav-ic{position:relative;width:24px;height:24px;display:grid;place-items:center}
.nav-ic svg{grid-area:1/1;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.nav-ic svg + svg{opacity:0}
.nav a.on .nav-ic svg:first-child{opacity:0}
.nav a.on .nav-ic svg + svg{opacity:1}
.nav a:active .nav-ic{transform:scale(.9)}

/* --- grouped list (Apartments / All Bookings) — iOS Settings-style --- */
.group{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.group > *{padding:14px 16px;border-top:1px solid var(--border)}
.group > *:first-child{border-top:0}
@media (min-width:1024px){.group{max-width:660px}}
.apt-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.apt-ctl select{width:auto;min-width:104px;max-width:132px}

/* --- motion primitives --- */
@keyframes rowin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slidefwd{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideback{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.slide-fwd{animation:slidefwd .3s var(--ease)}
.slide-back{animation:slideback .3s var(--ease)}
/* cascade rows only on a real tab change — never on an in-place render() (zone/date/status edit) */
.slide-fwd .stagger > *,.slide-back .stagger > *{animation:rowin .32s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}

/* View Transitions API cross-fade (tab switches, theme toggle) — see viewTransition().
   Only the main content area gets a real crossfade; the topbar and sidebar/tab-bar are
   pinned to their own named groups with animation disabled so they never resize or
   flicker when a new screen is a different height (was the "expanding logo" bug). */
::view-transition-group(app-topbar),
::view-transition-group(app-nav){ animation:none; }
::view-transition-old(app-topbar), ::view-transition-new(app-topbar),
::view-transition-old(app-nav), ::view-transition-new(app-nav){ animation:none; opacity:1; mix-blend-mode:normal; }
::view-transition-old(app-main){animation:vt-out .22s var(--ease) both}
::view-transition-new(app-main){animation:vt-in .24s var(--ease) both}
::view-transition-old(root),::view-transition-new(root){animation-duration:0s}
@keyframes vt-out{to{opacity:0;transform:translateY(-4px) scale(.99)}}
@keyframes vt-in{from{opacity:0;transform:translateY(4px) scale(1.008)}}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .stagger > *,.apt .exp .inner{animation-delay:0 !important;transition-delay:0 !important}
  .seg-thumb{transition:none !important}
}

/* Fix 1 — drop the double-tap-to-zoom wait on everything tappable (mobile). */
.btn,.btn-ghost,.ico,.iconbtn,.step,.seg button,.nav a,.apt,.undo-link,.toast-undo,
.combo-trigger,.combo-opt,[data-action]{touch-action:manipulation}

/* --- Apple-style hover (mouse-capable devices only; touch keeps the plain :active press) --- */
.btn,.btn-ghost,.ico,.iconbtn,.step{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease),opacity .15s var(--ease)}
.btn-red{background:linear-gradient(180deg,color-mix(in srgb,var(--red),#fff 8%),var(--red))}
.btn-green{background:linear-gradient(180deg,color-mix(in srgb,var(--green),#fff 8%),var(--green))}
.btn-red:active{background:var(--red)}
.btn-green:active{background:var(--green)}
@media (hover:hover){
  .btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
  .btn:hover:not(:active){transform:translateY(-1px) scale(1.012)}
  .btn-ghost:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .btn-ghost:hover:not(:active){transform:translateY(-1px) scale(1.012)}
  .btn-red:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--red) 40%,transparent)}
  .btn-green:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--green) 40%,transparent)}
  .ico:hover,.iconbtn:hover,.step:hover{opacity:.9}
  .ico:hover:not(:active),.iconbtn:hover:not(:active),.step:hover:not(:active){transform:translateY(-1px) scale(1.06)}
}

/* --- zone tabs: "this is your zone" indicator (Check in/out only) --- */
/* --- zone tabs: "this is your zone" indicator (Check in/out only) — a soft living glow
   instead of a flat outline: green for the worker's own zone, amber for the others. --- */
.seg button.zone-mine{color:var(--green);font-weight:700;
  background:linear-gradient(160deg,color-mix(in srgb,var(--green) 22%,transparent),color-mix(in srgb,var(--green) 5%,transparent));
  animation:zone-glow-g 2.8s ease-in-out infinite}
.seg button.zone-other{color:var(--orange);
  background:linear-gradient(160deg,color-mix(in srgb,var(--orange) 18%,transparent),color-mix(in srgb,var(--orange) 4%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--orange) 40%,transparent),0 0 12px -3px color-mix(in srgb,var(--orange) 45%,transparent)}
.seg button.zone-mine.on{color:var(--green)}
.seg button.zone-other.on{color:var(--orange)}
@keyframes zone-glow-g{
  0%,100%{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 45%,transparent),0 0 10px -2px color-mix(in srgb,var(--green) 40%,transparent)}
  50%{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 70%,transparent),0 0 18px -1px color-mix(in srgb,var(--green) 65%,transparent)}
}

/* --- schedule table: colourful, cell-based grid --- */
.sched-wrap{overflow-x:auto}
.sched-table{border-collapse:separate;border-spacing:6px;width:100%;min-width:660px}
.sched-table th{color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;text-align:center}
.sched-table th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2}
.sched-table td{font-size:13px;white-space:nowrap;text-align:center;padding:10px 10px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);transition:transform .12s var(--ease),box-shadow .12s var(--ease),border-color .12s var(--ease)}
.sched-table td.sched-name{position:sticky;left:0;z-index:1;text-align:left;font-weight:800;letter-spacing:-.01em;
  background:var(--surface-2);border-color:var(--border)}
.sched-cell.sched-work{background:color-mix(in srgb,var(--accent) 13%,var(--card));
  border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text);font-weight:700}
.sched-cell.sched-split{font-weight:700;border-color:color-mix(in srgb,var(--accent) 30%,transparent);
  background:linear-gradient(114deg,color-mix(in srgb,var(--accent) 15%,var(--card)) 0 47%,
    color-mix(in srgb,var(--blue) 15%,var(--card)) 53% 100%)}
.sched-cell.sched-free{background:var(--surface);color:var(--dim);font-style:italic}
.sched-cell.sched-empty{background:var(--surface);color:var(--dim)}
.sched-zone-row td{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left;border:0}
.sched-zone-row td .ico{color:var(--on-accent);border-color:color-mix(in srgb,#fff 35%,transparent);
  background:color-mix(in srgb,#fff 14%,transparent)}
.sched-night td{background:var(--surface-2);border-color:var(--border);font-weight:700}
.sched-night td.sched-name{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.sched-table td[data-action]{cursor:pointer}
@media (hover:hover){
  .sched-table td[data-action]:hover{border-color:var(--accent);box-shadow:0 5px 14px rgba(20,16,45,.14);transform:translateY(-1px)}
}

/* --- desktop / wide-viewport layout (mobile below 768 is untouched) --- */
@media (min-width:768px) and (max-width:1023px){
  #app{max-width:720px}
}
/* ≥1024px: a real macOS/iPadOS-style sidebar replaces the bottom tab bar (HIG: sidebars over
   tab bars once there's room for a persistent, always-visible nav column). Fills the full
   viewport width — only the reading column inside main is capped, like Mail/Notes on macOS. */
@media (min-width:1024px){
  #app{max-width:none;width:100%;padding-bottom:32px;
    display:grid;grid-template-columns:252px minmax(0,1fr);
    grid-template-areas:"topbar topbar" "nav main";column-gap:0;row-gap:0}
  .login-wrap{grid-column:1/-1;grid-row:1/-1}

  .topbar{grid-area:topbar;position:static;padding:16px 32px}
  .brand{font-size:15px}

  .nav{grid-area:nav;position:sticky;top:28px;align-self:start;
    display:block;background:transparent;border:0;padding:8px 16px 32px;
    max-height:calc(100dvh - 56px)}
  .nav-inner{max-width:none;flex-direction:column;gap:2px}
  .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;font-size:13.5px;padding:11px 13px;text-align:left}
  .nav a .nav-ic{width:20px;height:20px}
  .nav a span:last-child{font-weight:600}

  main{grid-area:main;border-left:1px solid var(--border);min-width:0}
  .screen{padding:26px 40px 48px;max-width:1400px;margin:0 auto}
  .cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .cardgrid>.card{margin-top:0}
  .cardgrid>.empty{grid-column:1/-1}
  .stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .stack>.card{margin-top:0}
  .hero-grid{max-width:560px}
  dialog{max-width:600px}
  .sched-table{min-width:0}
}
@media (min-width:1440px){
  .cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1800px){
  .cardgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  #app{grid-template-columns:276px minmax(0,1fr)}
}
</style>
</head>

  <div class="skel-body">
    <span class="skel skel-line" style="width:150px;height:26px;margin-bottom:16px"></span>
    <span class="skel skel-card"></span>

    <span class="skel skel-card"></span>
  </div>
</div></div>

/* ========================================================================
   HELPERS
   ===================================================================== */

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const pad = n => String(n).padStart(2, "0");
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => fmtISO(new Date());
const addDays = (iso, n) => { const d = new Date(iso + "T00:00"); d.setDate(d.getDate() + n); return fmtISO(d); };
const prettyDate = iso => new Date(iso + "T00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });

const WEEKDAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const mondayOf = iso => { const day = new Date(iso + "T00:00").getDay(); return addDays(iso, day === 0 ? -6 : 1 - day); };
const weekDates = weekStart => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
const ddmm = iso => { const d = new Date(iso + "T00:00"); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`; };

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.schedule) parsed.schedule = {}; // upgrade older saved data that predates the Schedule feature
      return parsed;
    }
  } catch (e) { /* fall through to seed */ }
  const fresh = seedDB();
  saveDB(fresh);
  return fresh;
}
function saveDB(d) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(d)); } catch (e) { /* private mode / full: keep in memory */ }
}

function loadAccounts() {
  try {
    const raw = localStorage.getItem(ACCOUNTS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through to seed */ }
  const fresh = seedAccounts();
  saveAccounts(fresh);
  return fresh;
}
function saveAccounts(list) {
  try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list)); } catch (e) { /* private mode / full: keep in memory */ }
}

  const t = todayStr();
  return list.find(b => b.arrival_date <= t && b.departure_date >= t)
      || list.find(b => b.arrival_date > t)
      || null;
}

  if (b.status === "terminated") return "terminated";
  const t = todayStr();
  if (b.departed || b.departure_date < t) return "past";
  if (b.arrival_date > t) return "upcoming";
  return "current";
}

// Undo helpers for arrived / departed / clean. Pure: caller passes the linked apartment.
// Each action pushes a {a, at, by, prev} entry onto the target's _history; revert pops it
// and restores prev (the apartment status captured just before the action).
function revertBookingAction(b, apt) {
  const h = b._history || [];
  const last = h[h.length - 1];
  if (!last || (last.a !== "arrived" && last.a !== "departed")) return false;
  if (last.a === "arrived") b.arrived = false; else b.departed = false;
  if (last.prev != null && apt) apt.status = last.prev;
  h.pop();
  return true;
}
function revertAptClean(apt) {
  const h = apt._history || [];
  const last = h[h.length - 1];
  if (!last || last.a !== "cleaned") return false;
  apt.status = last.prev || "cleaning";
  h.pop();
  return true;
}

const app = $("#app");

const prefersReducedMotion = () => matchMedia("(prefers-reduced-motion:reduce)").matches;

// smooth cross-fade between tab / theme changes via the View Transitions API, when the
// browser supports it and the person hasn't asked for reduced motion; falls back to a
// plain synchronous update everywhere else — nothing about the app depends on this running.
function viewTransition(update) {
  if (!document.startViewTransition || prefersReducedMotion()) { update(); return; }
  document.startViewTransition(() => update());
}

// empty state: large low-opacity icon above the message (§8)
const empty = (msg, icon, style = "") =>
  `<div class="empty"${style ? ` style="${style}"` : ""}>${icon ? `<span class="empty-ic">${icon}</span>` : ""}<span>${esc(msg)}</span></div>`;

// small ring gauge (Apple-Health-style) — done/total drawn as a stroked circle, 0 done = empty track
function ringSvg(done, total) {
  const r = 17, c = 2 * Math.PI * r;
  const pct = total > 0 ? Math.max(0, Math.min(1, done / total)) : 0;
  const off = (c * (1 - pct)).toFixed(1);
  return `<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="4"/>
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off}" transform="rotate(-90 22 22)"
      style="transition:stroke-dashoffset .6s var(--ease)"/>
  </svg>`;
}

// "today at a glance" gradient hero — the graphic summary above the lists (§ redesign)
function heroToday(ins, outs) {
  const arrived = ins.filter(b => b.arrived).length;
  const departed = outs.filter(b => b.departed).length;
  return `<div class="hero-grid stagger">
    <div class="hero-tile hero-a" style="--i:0">
      <div class="hero-ring">${ringSvg(arrived, ins.length)}</div>
      <div class="hero-num" data-count="hero-in">${ins.length}</div>
      <div class="hero-label">Check-ins</div>
      <div class="hero-sub">${arrived ? `${arrived} arrived` : "none yet"}</div>
    </div>
    <div class="hero-tile hero-b" style="--i:1">
      <div class="hero-ring">${ringSvg(departed, outs.length)}</div>
      <div class="hero-num" data-count="hero-out">${outs.length}</div>
      <div class="hero-label">Check-outs</div>
      <div class="hero-sub">${departed ? `${departed} left` : "none yet"}</div>
    </div>
  </div>`;
}

const NAV_ORDER = ["checkinout", "apartments", "schedule", "allbookings", "users"];
let _prevRoute = route;

function render() {
  if (!session) { renderLogin(); _prevRoute = null; return; }
  const screen = route === "apartments" ? screenApartments()
    : route === "schedule" ? screenSchedule()
    : route === "allbookings" ? screenAllBookings()
    : route === "users" ? screenUsers()
    : screenCheckInOut();
  // directional slide for real tab navigation; plain fade for an in-place refresh
  const from = NAV_ORDER.indexOf(_prevRoute), to = NAV_ORDER.indexOf(route);
  const mainCls = from >= 0 && to >= 0 && from !== to ? (to > from ? "slide-fwd" : "slide-back") : "fade";
  app.innerHTML = topbar() + `<main class="${mainCls}">${screen}</main>` + bottomNav();
  _prevRoute = route;
  postRender();
}

// runs after every render(): position segmented-control thumbs, roll changed counts
function postRender() {
  layoutSegThumbs();
  layoutNavThumb();
  updateCounts();
}

/* --- bottom tab bar / desktop sidebar: one sliding gradient thumb, FLIP across re-renders.
   Works for both orientations — it reads the active link's own box, so a row (mobile) or a
   column (desktop sidebar) both "just work". --- */
let _navPos = null;
function layoutNavThumb() {
  const inner = document.querySelector(".nav-inner");
  const thumb = inner && inner.querySelector(".nav-thumb");
  const on = inner && inner.querySelector("a.on");
  if (!thumb) return;
  if (!on) { thumb.style.opacity = "0"; return; }
  thumb.style.opacity = "1";
  const next = { x: on.offsetLeft, y: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight };
  const prev = _navPos;
  const put = p => {
    thumb.style.transform = `translate(${p.x}px, ${p.y}px)`;
    thumb.style.width = `${p.w}px`; thumb.style.height = `${p.h}px`;
  };
  if (prev && (prev.x !== next.x || prev.y !== next.y || prev.w !== next.w || prev.h !== next.h) && !prefersReducedMotion()) {
    thumb.style.transition = "none";
    put(prev);
    void thumb.offsetWidth;                 // reflow so the next change animates
    thumb.style.transition = "";
    requestAnimationFrame(() => put(next));
  } else {
    put(next);
  }
  _navPos = next;
}
addEventListener("resize", () => { _navPos = null; layoutNavThumb(); });

/* --- Large Title scroll effect: maps window scroll (0..36px) to --scroll-p (0..1) on the
   root element, rAF-throttled. Pure CSS custom property, so it survives every render() —
   new .page-title / .topbar-title elements pick it up immediately, no re-wiring needed. --- */
let _scrollTicking = false;
function onScroll() {
  if (_scrollTicking) return;
  _scrollTicking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    const p = Math.max(0, Math.min(1, y / 36));
    document.documentElement.style.setProperty("--scroll-p", p.toFixed(3));
    _scrollTicking = false;
  });
}
addEventListener("scroll", onScroll, { passive: true });

/* --- segmented control: slide one thumb between button slots, FLIP across re-renders --- */
const _segPos = {};
function layoutSegThumbs() {
  document.querySelectorAll(".seg[data-seg]").forEach(seg => {
    const key = seg.dataset.seg;
    const thumb = seg.querySelector(".seg-thumb");
    const on = seg.querySelector("button.on");
    if (!thumb) return;
    if (!on) { thumb.style.opacity = "0"; return; }
    thumb.style.opacity = "1";
    const next = { x: on.offsetLeft, w: on.offsetWidth };
    const prev = _segPos[key];
    const put = p => { thumb.style.transform = `translateX(${p.x}px)`; thumb.style.width = `${p.w}px`; };
    if (prev && (prev.x !== next.x || prev.w !== next.w) && !prefersReducedMotion()) {
      thumb.style.transition = "none";
      put(prev);
      void thumb.offsetWidth;                 // reflow so the next change animates
      thumb.style.transition = "";
      requestAnimationFrame(() => put(next));
    } else {
      put(next);
    }
    _segPos[key] = next;
  });
}

/* --- roll a metric to its new value instead of snapping (§9) --- */
const _countCache = {};
function animateCount(el, to, from) {
  if (from === to) { el.textContent = to; return; }
  const dur = 480, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function updateCounts() {
  const reduce = prefersReducedMotion();
  document.querySelectorAll("[data-count]").forEach(el => {
    const key = el.dataset.count, to = Number(el.textContent) || 0, from = _countCache[key];
    if (!reduce && Number.isFinite(from) && from !== to) animateCount(el, to, from);
    _countCache[key] = to;
  });
}

/* ---- Check in / out ---- */

function screenCheckInOut() {
  const t = todayStr();
  const rel = selectedDate === t ? "today"
    : selectedDate === addDays(t, -1) ? "yesterday"
    : selectedDate === addDays(t, 1) ? "tomorrow" : "";

  const seg = ["yesterday", "today", "tomorrow"]
    .map(k => `<button data-action="reldate" data-rel="${k}" class="${rel === k ? "on" : ""}">${k[0].toUpperCase() + k.slice(1)}</button>`)
    .join("");

  const myZone = isAdmin() ? null : workerZone(session.username);
  const zoneTabs = [1, 2, 3].map(z => {
    const cls = [activeZone === z ? "on" : "", myZone ? (myZone === z ? "zone-mine" : "zone-other") : ""]
      .filter(Boolean).join(" ");
    return `<button data-action="zone" data-zone="${z}" class="${cls}">Zone ${z}</button>`;
  }).join("");

  const ins  = db.bookings.filter(b => b.arrival_date === selectedDate && aptById(b.apartmentId)?.zone === activeZone);
  const outs = db.bookings.filter(b => b.departure_date === selectedDate && aptById(b.apartmentId)?.zone === activeZone);

  const list = (arr, kind) => arr.length
    ? arr.map((b, i) => bookingCard(b, kind, i)).join("")
    : empty(`No ${kind === "in" ? "check-ins" : "check-outs"} on this day.`, I.cal);

  return `<div class="screen">
    <div class="between">
      <h2 class="page-title">Check in / out</h2>
      ${isAdmin() ? `<button class="iconbtn" data-action="add-booking" aria-label="Add booking">${I.plus}</button>` : ""}
    </div>

    ${heroToday(ins, outs)}

    <div class="seg" data-seg="zone" style="margin-top:14px"><i class="seg-thumb"></i>${zoneTabs}</div>

    <div style="margin-top:14px">
      <div class="seg" data-seg="reldate"><i class="seg-thumb"></i>${seg}</div>
      <div class="datestep">
        <button class="step" data-action="stepdate" data-step="-1" aria-label="Previous day">${I.left}</button>
        <input type="date" value="${selectedDate}" data-action="pickdate" aria-label="Pick date">
        <button class="step" data-action="stepdate" data-step="1" aria-label="Next day">${I.right}</button>
      </div>
    </div>

    <div class="section-head"><h3>Check-ins</h3><span class="count" data-count="cio-in">${ins.length}</span></div>
    <div class="cardgrid stagger">${list(ins, "in")}</div>

    <div class="section-head"><h3>Check-outs</h3><span class="count" data-count="cio-out">${outs.length}</span></div>
    <div class="cardgrid stagger">${list(outs, "out")}</div>
  </div>`;
}

function bookingCard(b, kind, i = 0) {
  const apt = aptById(b.apartmentId) || {};
  const nights = nightsBetween(b.arrival_date, b.departure_date);
  const tax = touristTax(b.tax_paying_guest_count, nights);
  const rec = recDeposit(apt, b);
  const src = b.booking_source === "Agency" && b.agency_name ? `Agency · ${esc(b.agency_name)}` : esc(b.booking_source);

  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${apt.address || ""}, ${apt.town || ""}`)}`;
  const phone = digits(b.guest_phone);
  const terminated = b.status === "terminated";
  const cleaning = apt.status === "cleaning";
  const canAct = selectedDate <= todayStr();

  const statusPill = terminated
    ? `<span class="pill s-terminated">Terminated</span>`
    : `<span class="pill s-${apt.status || "ready"}">${apt.status || "—"}</span>`;

  // audit line stays as a trail; the inline undo link only while still safely reversible
  const lastH = (b._history || [])[(b._history || []).length - 1];
  let audit = "", undo = "";
  if (!terminated && lastH && (lastH.a === "arrived" || lastH.a === "departed")) {
    audit = `${lastH.a === "arrived" ? "Arrived" : "Departed"} · ${actionStamp(lastH)}`;
    if (bookingUndoable(b))
      undo = `<button class="undo-link" data-action="undo-action" data-target="booking" data-id="${b.id}">Undo ${lastH.a === "arrived" ? "arrival" : "departure"}</button>`;
  }
  const statusCol = `<div class="stat-col">${statusPill}` +
    `${audit ? `<div class="dim stat-note">${audit}</div>` : ""}${undo}</div>`;

  const waBtn = (k, icon, label) =>
    `<button class="ico" data-action="wa-msg" data-id="${b.id}" data-kind="${k}" aria-label="${label}"${phone ? "" : ' aria-disabled="true"'}>${icon}</button>`;

  let actionBtns = "";
  if (!terminated) {
    if (cleaning)  // apartment state, not a dated action — always offer the way back to "ready"
      actionBtns += `<button class="btn btn-green" style="margin-top:12px" data-action="mark-clean" data-id="${b.apartmentId}">Apartment is clean</button>`;
    else if (canAct && kind === "in" && !b.arrived)
      actionBtns += `<button class="btn" style="margin-top:12px" data-action="mark-arrived" data-id="${b.id}">Arrived</button>`;
    else if (canAct && kind === "out" && !b.departed)
      actionBtns += `<button class="btn" style="margin-top:12px" data-action="mark-departed" data-id="${b.id}">They left</button>`;
  }
  if (isAdmin() && !terminated && (kind === "in" ? !b.arrived : !b.departed))
    actionBtns += `<button class="btn btn-red" style="margin-top:8px" data-action="terminate-booking" data-id="${b.id}">Terminate</button>`;

  return `<div class="card" data-booking="${b.id}" style="--i:${i}">
    <div class="between">
      <div>
        <div style="font-weight:700;font-size:var(--fs-headline);letter-spacing:-.015em">${esc(b.guest_name)}</div>
        <div class="apt-name">${esc(apt.name || "—")}</div>
        <div class="sub" style="font-size:12px;margin-top:1px">${src}</div>
      </div>
      ${statusCol}
    </div>
    ${b.guest_phone ? `<div class="row" style="gap:8px;margin-top:10px">
      <span style="font-weight:600">${esc(b.guest_phone)}</span>
      ${phone ? `<button class="ico" data-action="copy-phone" data-id="${b.id}" aria-label="Copy phone number">${I.copy}</button>` : ""}
    </div>` : ""}

    <div class="row2" style="margin-top:12px">
      <div><div class="metric-label">Guests</div><div style="font-weight:600">${b.guest_count}</div></div>
      <div><div class="metric-label">${nights} night${nights === 1 ? "" : "s"}</div>
        <div style="font-weight:600">${prettyDate(b.arrival_date)} ${I.arrow} ${prettyDate(b.departure_date)}</div></div>
    </div>

    <div class="card muted-card" style="margin-top:12px">
      <div class="between">
        <div>
          <div class="metric-label">Tourist tax due</div>
          <div class="metric" data-tax-total>${eur(tax)}</div>
          <div class="dim" style="font-size:12px;margin-top:2px">€${TAX_RATE.toFixed(2)} × pax × ${nights} night${nights === 1 ? "" : "s"} · over-${TAX_FREE_AGE}s only</div>
        </div>
        <div style="width:96px">
          <label class="f">Tax-paying</label>
          <input type="number" min="0" step="1" value="${b.tax_paying_guest_count}"
                 data-field="tax_paying_guest_count" data-id="${b.id}" data-nights="${nights}" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="row2" style="margin-top:12px">
      <div class="field">
        <label class="f">Recommended deposit</label>
        <input value="${eur0(rec)}" disabled>
      </div>
      <div class="field">
        <label class="f">Deposit taken (€)</label>
        <input type="number" min="0" step="1" value="${b.actual_deposit_taken}"
               data-field="actual_deposit_taken" data-id="${b.id}" inputmode="numeric">
      </div>
    </div>

    <div class="field" style="margin-top:10px">
      <label class="f">Notes</label>
      <textarea rows="2" data-field="notes" data-id="${b.id}" placeholder="Notes about the guests…">${esc(b.notes)}</textarea>
    </div>

    <div class="acts" style="margin-top:12px">
      <a class="ico" href="${mapsUrl}" target="_blank" rel="noopener" aria-label="Open in Google Maps">${I.pin}</a>
      ${waBtn("in", I.chat, "Send check-in message")}
      ${waBtn("out", I.bell, "Send check-out message")}
      ${waBtn("review", I.star, "Send review request")}
    </div>

    ${actionBtns}
  </div>`;
}

// live-filter search field — shared by Apartments & All Bookings; the results container is

function apartmentsBody(zone, query) {
  const q = query.trim().toLowerCase();
  const apts = db.apartments.filter(a => a.zone === zone &&
    (!q || a.name.toLowerCase().includes(q) || (a.address || "").toLowerCase().includes(q)));
  return apts.length
    ? `<div class="group stagger" style="margin-top:14px">${apts.map((a, i) => apartmentCard(a, i)).join("")}</div>`
    : empty(q ? `No apartments match "${query}".` : `No apartments in Zone ${zone}.`, I.grid, "margin-top:14px");
}

function bookingsBody(zone, query) {
  const q = query.trim().toLowerCase();
  const apts = db.apartments.filter(a => a.zone === zone).filter(a => {
    if (!q) return true;
    if (a.name.toLowerCase().includes(q)) return true;
    return db.bookings.some(b => b.apartmentId === a.id && b.guest_name.toLowerCase().includes(q));
  });
  return apts.length
    ? `<div class="group stagger" style="margin-top:14px">${apts.map((a, i) => allBookingsCard(a, i)).join("")}</div>`
    : empty(q ? `No matches for "${query}".` : `No apartments in Zone ${zone}.`, I.grid, "margin-top:14px");
}

function scheduleRow(zone, rowIndex, row, dates) {
  const name = accountName(row.username) || "Unassigned";
  const nameCell = isAdmin()
    ? `<td class="sched-name"><span data-action="edit-sched-worker" data-zone="${zone}" data-row="${rowIndex}">${esc(name)}</span>
         <button class="ico" style="width:28px;height:28px;margin-left:6px" data-action="remove-sched-row" data-zone="${zone}" data-row="${rowIndex}" aria-label="Remove ${esc(name)}">${I.close}</button></td>`
    : `<td class="sched-name">${esc(name)}</td>`;

  const cells = dates.map(d => {
    const val = row.days[d];
    const type = !val || val === "—" ? "empty" : val === "FREE" ? "free" : val.includes("//") ? "split" : "work";
    const display = type === "free" ? "Free" : type === "empty" ? "—" : esc(val);
    const cls = `sched-cell sched-${type}`;
    return isAdmin()
      ? `<td class="${cls}" data-action="edit-sched-hours" data-zone="${zone}" data-row="${rowIndex}" data-date="${d}">${display}</td>`
      : `<td class="${cls}">${display}</td>`;
  }).join("");

  return `<tr>${nameCell}${cells}</tr>`;
}

/* ========================================================================
   EVENTS  (delegated on document — survives re-render, reaches <dialog>)
   ===================================================================== */

function persistBooking(id, patch) {
  const b = db.bookings.find(x => x.id === id);
  if (!b) return;
  Object.assign(b, patch);
  saveDB(db);
}

// append an audit/undo entry to a booking or apartment (see revertBookingAction / revertAptClean)
function recordAction(target, action, prevAptStatus) {
  const h = (target._history = target._history || []);
  h.push({ a: action, at: Date.now(), by: (session && session.name) || "", prev: prevAptStatus });
  if (h.length > 8) h.splice(0, h.length - 8);   // only the last entry is ever read; keep a short tail
}

// is the most recent logged action still safely reversible? (shared by the inline links and the toast)
function bookingUndoable(b) {
  const last = (b._history || [])[(b._history || []).length - 1];
  if (!last || b.status === "terminated") return false;
  if (last.a === "arrived")  return !!b.arrived && !b.departed;
  if (last.a === "departed") return !!b.departed && aptById(b.apartmentId)?.status === "cleaning";
  return false;
}
function aptCleanUndoable(a) {
  const last = (a._history || [])[(a._history || []).length - 1];
  return !!last && last.a === "cleaned" && a.status === "ready";
}

/* ---- undo toast (lives in #toast, outside #app, so render() doesn't wipe it) ---- */
let _toastUndo = null, _toastTimer = null;

// re-looks-up by id at click time and re-checks reversibility, so a follow-up action
// inside the 7s window can't make the toast's Undo restore a now-stale status
function toastWithUndo(msg, targetKind, id) {
  showToast(msg, () => {
    if (targetKind === "booking") {
      const b = db.bookings.find(x => x.id === id);
      if (b && bookingUndoable(b)) revertBookingAction(b, aptById(b.apartmentId));
    } else {
      const apt = aptById(id);
      if (apt && aptCleanUndoable(apt)) revertAptClean(apt);
    }
    saveDB(db); render();
  }, true);   // success toast — show the draw-in checkmark
}
function showToast(msg, undoFn, withCheck) {
  const host = $("#toast");
  if (!host) return;
  _toastUndo = undoFn || null;
  host.innerHTML = `<div class="toast">
    ${withCheck ? `<span class="toast-check">${I.check}</span>` : ""}
    <span>${esc(msg)}</span>
    ${undoFn ? `<button class="toast-undo" data-action="toast-undo">Undo</button>` : ""}
  </div>`;
  host.hidden = false;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(hideToast, 7000);
}
function hideToast() {
  clearTimeout(_toastTimer);
  _toastUndo = null;
  const host = $("#toast");
  if (!host || host.hidden) return;
  const card = host.firstElementChild;
  if (card) card.classList.add("out");
  setTimeout(() => { host.hidden = true; host.innerHTML = ""; }, 170);
}

/* ---- copy guest phone to clipboard (Fix 4) ---- */
function copyPhone(text) {
  const ok = () => showToast("Phone number copied");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, () => { if (legacyCopy(text)) ok(); });
  } else if (legacyCopy(text)) ok();
}
function legacyCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.select();
    const done = document.execCommand("copy");
    ta.remove();
    return done;
  } catch (e) { return false; }
}

/* ---- searchable apartment picker list (Fix 3) ---- */
function aptComboListHtml(query, selectedId) {
  const q = String(query || "").trim().toLowerCase();
  const match = db.apartments.filter(a => !q || String(a.name).toLowerCase().includes(q));
  const group = (title, list) => list.length
    ? `<div class="combo-group">${title}</div>` + list.map(a =>
        `<button type="button" class="combo-opt${a.id === selectedId ? " sel" : ""}"
          data-action="apt-combo-pick" data-id="${a.id}" data-name="${esc(a.name)}">
          <span>${esc(a.name)}</span>${a.id === selectedId ? I.check : ""}</button>`).join("")
    : "";
  const seen = new Set();
  let html = [1, 2, 3].map(z => {
    const list = match.filter(a => Number(a.zone) === z);
    list.forEach(a => seen.add(a.id));
    return group("Zone " + z, list);
  }).join("");
  html += group("Other", match.filter(a => !seen.has(a.id)));   // never hide an apartment with an odd/missing zone
  return html || `<div class="empty" style="padding:18px 10px">No apartments match.</div>`;
}

/* ---- Google Places address autocomplete (Fix 2 — optional; needs a key, see <head>) ---- */
let _gmapsPromise = null;
function loadGoogleMaps() {
  if (_gmapsPromise) return _gmapsPromise;
  const key = window.GOOGLE_MAPS_API_KEY;
  if (!key || key === "YOUR_GOOGLE_MAPS_API_KEY_HERE")
    return (_gmapsPromise = Promise.reject(new Error("no Google Maps API key")));
  _gmapsPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) +
            "&v=weekly&libraries=places&loading=async";
    s.async = true;
    s.onload = resolve;
    s.onerror = () => { _gmapsPromise = null; reject(new Error("Google Maps failed to load")); };
    document.head.appendChild(s);
  });
  return _gmapsPromise;
}
function setHidden(name, val) {
  const el = dlg.querySelector('input[name="' + name + '"]');
  if (el) el.value = val;
}
// Called right after the apartment dialog opens (its <input> is rendered fresh each time).
// On any failure the plain text input is left exactly as-is.
function initAddressAutocomplete() {
  const input = dlg.querySelector('input[name="address"]');
  if (!input || input.dataset.acReady) return;
  loadGoogleMaps()
    .then(() => google.maps.importLibrary("places"))
    .then(() => {
      if (!dlg.open || !dlg.contains(input)) return;
      const ac = new google.maps.places.PlaceAutocompleteElement();
      ac.className = "addr-ac";
      (input.closest("label.f") || input).after(ac);
      input.hidden = true;
      input.required = false;          // hidden inputs are barred from constraint validation — see submit handler
      input.dataset.acReady = "1";
      const pick = async ev => {
        const pred = ev.placePrediction || (ev.detail && ev.detail.placePrediction);
        const place = pred ? pred.toPlace() : (ev.place || (ev.detail && ev.detail.place));
        if (!place) return;
        try { await place.fetchFields({ fields: ["formattedAddress", "location"] }); }
        catch (e) { return; }
        input.value = place.formattedAddress || input.value;
        const loc = place.location;
        if (loc) {
          setHidden("lat", typeof loc.lat === "function" ? loc.lat() : loc.lat);
          setHidden("lng", typeof loc.lng === "function" ? loc.lng() : loc.lng);
        }
        const err = dlg.querySelector(".err");
        if (err) err.textContent = "";
      };
      ac.addEventListener("gmp-select", pick);
      ac.addEventListener("gmp-placeselect", pick);   // older widget builds
      // keep whatever the user typed even if they never pick a suggestion, so Save doesn't reject a valid address
      ac.addEventListener("input", () => {
        const typed = (ac.value != null ? ac.value : (ac.querySelector("input") || {}).value || "").trim();
        if (typed) { input.value = typed; const err = dlg.querySelector(".err"); if (err) err.textContent = ""; }
      });
    })
    .catch(() => { /* no key / offline / blocked — the plain text input stays */ });
}

// keep the live session (topbar name, isAdmin() checks) in sync when an admin edits their own account
function syncSelfSession(acc) {
  if (!session || acc.username !== session.username) return;
  session = { username: acc.username, name: acc.name, role: acc.role };
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
}

document.addEventListener("click", e => {
  // collapse an open apartment-combo panel on any click outside it
  if (dlg.open && !e.target.closest("[data-combo]")) {
    const p = dlg.querySelector(".combo-panel:not([hidden])");
    if (p) p.hidden = true;
  }

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;

  if (el.tagName === "A") e.preventDefault?.();

  switch (a) {
    case "nav": {
      const dest = el.dataset.route;
      if (dest === route) break;
      route = dest;
      viewTransition(render);
      break;
    }
    case "theme":
      viewTransition(toggleTheme); break;
    case "logout":
      session = null; route = "checkinout"; try { localStorage.removeItem(SESSION_KEY); } catch (e) {} render(); break;
    case "reldate":
      selectedDate = addDays(todayStr(), { yesterday: -1, today: 0, tomorrow: 1 }[el.dataset.rel]); render(); break;
    case "stepdate":
      selectedDate = addDays(selectedDate, +el.dataset.step); render(); break;
    case "zone":
      activeZone = +el.dataset.zone; render(); break;
    case "apts-search-clear":
      searchApts = ""; render(); break;
    case "bookings-search-clear":
      searchBookings = ""; render(); break;
    case "toggle-apt": {
      if (e.target.closest("select, textarea, input")) break;   // let form controls work without collapsing the card
      const id = el.dataset.id;
      openApts.has(id) ? openApts.delete(id) : openApts.add(id);
      el.classList.toggle("open");
      break;
    }
    case "toggle-history": {
      const id = el.dataset.id;
      openHistory.has(id) ? openHistory.delete(id) : openHistory.add(id);
      el.classList.toggle("open");
      break;
    }
    case "undo-action": {
      if (el.dataset.target === "booking") {
        const b = db.bookings.find(x => x.id === el.dataset.id);
        if (b && bookingUndoable(b)) revertBookingAction(b, aptById(b.apartmentId));
      } else {
        const apt = aptById(el.dataset.id);
        if (apt && aptCleanUndoable(apt)) revertAptClean(apt);
      }
      saveDB(db); hideToast(); render();
      break;
    }
    case "toast-undo":
      if (_toastUndo) _toastUndo();
      hideToast();
      break;
    case "add-booking":   openBookingDialog(); break;
    case "add-apartment": openApartmentDialog(); break;
    case "edit-apartment": openApartmentDialog(el.dataset.id); break;
    case "delete-apartment": {
      const n = db.bookings.filter(b => b.apartmentId === el.dataset.id).length;
      confirmDialog("confirm-delete-apt", el.dataset.id,
        n ? `Delete this apartment and its ${n} booking${n === 1 ? "" : "s"}?` : "Delete this apartment?");
      break;
    }
    case "add-user":      openNewUserDialog(); break;
    case "edit-user":     openEditUserDialog(el.dataset.id); break;
    case "edit-templates": openTemplatesDialog(); break;
    case "mark-arrived":  openConfirmAction("confirm-arrived", el.dataset.id); break;
    case "mark-departed": openConfirmAction("confirm-departed", el.dataset.id); break;
    case "mark-clean":    openConfirmAction("confirm-clean", el.dataset.id); break;
    case "terminate-booking": openConfirmAction("confirm-terminate", el.dataset.id); break;
    case "wa-msg":        openWaDialog(el.dataset.id, el.dataset.kind); break;
    case "wa-send": {
      const ta = dlg.querySelector('[name="wa_text"]');
      const ph = el.dataset.phone;
      if (ta && ph) window.open(`https://wa.me/${ph}?text=${encodeURIComponent(ta.value)}`, "_blank", "noopener");
      dlg.close("sent");
      break;
    }
    case "promote-user": {
      const acc = ACCOUNTS.find(x => x.username === el.dataset.id);
      if (acc) confirmDialog("confirm-promote", acc.username, `Are you sure you want to promote ${acc.name} to admin?`);
      break;
    }
    case "demote-user": {
      const acc = ACCOUNTS.find(x => x.username === el.dataset.id);
      if (acc) confirmDialog("confirm-demote", acc.username, `Are you sure you want to demote ${acc.name} to worker?`);
      break;
    }
    case "sched-thisweek": scheduleWeekStart = mondayOf(todayStr()); render(); break;
    case "sched-stepweek": scheduleWeekStart = addDays(scheduleWeekStart, +el.dataset.step * 7); render(); break;
    case "add-sched-row": {
      const z = +el.dataset.zone;
      openScheduleWorkerDialog(z, getScheduleWeek(scheduleWeekStart).zones[z].length);
      break;
    }
    case "edit-sched-worker": openScheduleWorkerDialog(+el.dataset.zone, +el.dataset.row); break;
    case "edit-sched-night":  openScheduleNightDialog(el.dataset.date); break;
    case "edit-sched-hours":  openScheduleHoursDialog(+el.dataset.zone, +el.dataset.row, el.dataset.date); break;
    case "remove-sched-row": {
      const z = +el.dataset.zone, r = +el.dataset.row;
      const worker = getScheduleWeek(scheduleWeekStart).zones[z][r];
      const label = accountName(worker?.username) || "this row";
      confirmDialog("confirm-remove-sched-row", `${z}|${r}`, `Remove ${label} from Zone ${z} this week?`);
      break;
    }
    case "sched-preset": {
      const [z, r, d] = dlg.querySelector("form").dataset.id.split("|");
      applyScheduleHours(+z, +r, d, el.dataset.value);
      // explicit non-"ok" value: dlg.close() with no arg leaves returnValue at whatever a PRIOR
      // dialog's Save last set it to, which would make the close listener re-process this dialog
      dlg.close("applied");
      break;
    }
    case "dlg-cancel":    dlg.close("cancel"); break;

    case "copy-phone": {
      const b = db.bookings.find(x => x.id === el.dataset.id);
      if (b && b.guest_phone) copyPhone(b.guest_phone);
      break;
    }
    case "apt-combo-open": {
      const combo = el.closest("[data-combo]");
      const panel = combo.querySelector(".combo-panel");
      panel.hidden = !panel.hidden;
      if (!panel.hidden) {
        const search = panel.querySelector(".combo-search");
        search.value = "";
        combo.querySelector("[data-combo-list]").innerHTML =
          aptComboListHtml("", combo.querySelector('[name="apartmentId"]').value);
        search.focus();
      }
      break;
    }
    case "apt-combo-pick": {
      const combo = el.closest("[data-combo]");
      combo.querySelector('[name="apartmentId"]').value = el.dataset.id;
      const label = combo.querySelector("[data-combo-label]");
      label.textContent = el.dataset.name;
      label.classList.remove("dim");
      combo.querySelector(".combo-panel").hidden = true;
      const err = combo.closest("form").querySelector(".err");
      if (err) err.textContent = "";
      break;
    }
  }
});
