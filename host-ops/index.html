<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Papaya Travel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
:root{
  color-scheme:light dark;
  --bg:#ffffff; --surface:#f6f4fc; --surface-2:#edeafb; --card:#ffffff;
  --text:#1b1830; --dim:#6c6885; --border:#e9e5f5;
  --accent:#6a44ff; --accent-2:#5734ec; --accent-soft:#efeaff; --on-accent:#fff;
  --green:#12b981; --orange:#f6a723; --blue:#3d9bff; --red:#ef4444;
  --shadow:0 1px 2px rgba(20,16,45,.05), 0 10px 30px rgba(20,16,45,.06);
  --r:18px; --r-sm:12px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131120; --surface:#1c1a2c; --surface-2:#252239; --card:#1c1a2c;
    --text:#f2f0fa; --dim:#a29ebb; --border:#312d47;
    --accent:#8f74ff; --accent-2:#7e61f5; --accent-soft:#241f3d;
    --green:#1fc98d; --orange:#ffb43d; --blue:#4ea6ff; --red:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#131120; --surface:#1c1a2c; --surface-2:#252239; --card:#1c1a2c;
  --text:#f2f0fa; --dim:#a29ebb; --border:#312d47;
  --accent:#8f74ff; --accent-2:#7e61f5; --accent-soft:#241f3d;
  --green:#1fc98d; --orange:#ffb43d; --blue:#4ea6ff; --red:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.45);
}
html,body{background:var(--bg);color:var(--text)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:100px}
h2{font-size:22px;letter-spacing:-.02em;margin:2px 0}
h3{font-size:17px;letter-spacing:-.01em;margin-bottom:12px}
small,.dim{color:var(--dim)}
button{font:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}

/* --- chrome --- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--border)}
@supports (backdrop-filter:blur(1px)){
  .topbar{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(20px) saturate(160%);
    border-bottom-color:color-mix(in srgb,var(--border) 55%,transparent)}
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(150deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff}
.top-actions{display:flex;align-items:center;gap:8px}
.who{font-size:13px;color:var(--dim);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.iconbtn{width:40px;height:40px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:11px;display:grid;place-items:center;transition:transform .09s var(--ease)}
.iconbtn:active{transform:scale(.94)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border)}
@supports (backdrop-filter:blur(1px)){
  .nav{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(20px) saturate(160%);
    border-top-color:color-mix(in srgb,var(--border) 55%,transparent)}
}
.nav-inner{width:100%;max-width:480px;display:flex;gap:6px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;
  color:var(--dim);font-size:11px;font-weight:600;transition:background .18s var(--ease),color .18s var(--ease)}
.nav a.on{color:var(--accent);background:var(--accent-soft)}

/* --- layout --- */
.screen{padding:16px 16px 8px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-head{display:flex;align-items:center;gap:8px;margin:18px 2px 10px}
.section-head .count{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:999px}

@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fade{animation:fade .22s var(--ease)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:12px}
.muted-card{background:var(--surface);box-shadow:none}

.metric{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1}
.metric-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:capitalize;white-space:nowrap}
.s-occupied{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.s-ready{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.s-cleaning{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.s-terminated{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.s-current{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.s-upcoming{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.s-past{background:color-mix(in srgb,var(--dim) 15%,transparent);color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-occupied{background:var(--green)} .d-ready{background:var(--orange)} .d-cleaning{background:var(--blue)} .d-terminated{background:var(--red)}

.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:600;text-align:right}

.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:12px 16px;border-radius:13px;
  width:100%;transition:transform .09s var(--ease),background .15s}
.btn:active{transform:scale(.98);background:var(--accent-2)}
.btn-ghost{border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;
  padding:12px 16px;border-radius:13px;transition:transform .09s var(--ease)}
.btn-ghost:active{transform:scale(.98)}
.btn-row{display:flex;gap:10px}

label.f{display:block;font-size:12px;color:var(--dim);font-weight:700;margin-bottom:6px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 12px;width:100%}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.field + .field{margin-top:10px}

/* action icons on a booking */
.acts{display:flex;gap:8px}
.ico{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);color:var(--accent);transition:transform .09s var(--ease)}
.ico:active{transform:scale(.93)}
.ico[aria-disabled=true]{opacity:.4;pointer-events:none}

/* segmented date control */
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);font-weight:600;padding:9px 6px;
  border-radius:10px;font-size:14px;transition:color .15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.datestep{display:flex;align-items:center;gap:8px;margin-top:10px}
.datestep input{text-align:center;font-weight:600}
.step{width:44px;height:44px;flex:none;border:1px solid var(--border);background:var(--surface);border-radius:12px;
  color:var(--text);display:grid;place-items:center;transition:transform .09s var(--ease)}
.step:active{transform:scale(.93)}

/* apartment card expand */
.apt{cursor:pointer}
.apt .exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.apt.open .exp{grid-template-rows:1fr}
.apt .exp > div{overflow:hidden}
.apt .exp .inner{padding-top:14px;margin-top:12px;border-top:1px solid var(--border)}
.chev{transition:transform .25s var(--ease);color:var(--dim)}
.apt.open .chev{transform:rotate(90deg)}

.empty{text-align:center;color:var(--dim);padding:26px 10px;font-size:14px}

/* undo affordances + audit line (safer check-in/out actions) */
.stat-col{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;text-align:right;max-width:52%}
.stat-note{font-size:11px;line-height:1.35}
.undo-link{border:0;background:none;color:var(--accent);font-weight:600;font-size:11px;line-height:1.4;padding:0}
.undo-link:active{opacity:.55}
@media (hover:hover){.undo-link:hover{text-decoration:underline}}

.count-badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:3px 9px;border-radius:999px;white-space:nowrap}

/* undo toast */
#toast{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:40;
  display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;max-width:452px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--shadow);
  padding:12px 14px;font-size:14px;font-weight:600}
.toast > span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast-undo{flex:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;
  font-size:13px;padding:7px 14px;border-radius:9px;transition:transform .09s var(--ease)}
.toast-undo:active{transform:scale(.94)}
@keyframes fadeout{to{opacity:0;transform:translateY(6px)}}
.toast.out{animation:fadeout .16s var(--ease) forwards}
@media (min-width:1024px){#toast{bottom:24px}}

/* dialog */
dialog{border:0;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:480px;margin:auto auto 0;background:var(--card);color:var(--text);box-shadow:var(--shadow);
  max-height:calc(100dvh - 20px);overflow-y:auto}
dialog::backdrop{background:rgba(10,8,24,.45);backdrop-filter:blur(2px)}
@media (min-width:520px){dialog{border-radius:22px;margin:auto;max-width:520px}}
dialog[open]{animation:dlgpop .2s var(--ease)}
dialog[open]::backdrop{animation:fade .2s var(--ease)}
@keyframes dlgpop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
dialog menu{display:flex;gap:10px;margin-top:16px;padding:0}
dialog menu button{flex:1}
.dform label.f{margin-top:12px}
.dform h3{margin-bottom:4px}

/* searchable apartment picker (booking dialog) */
.combo{position:relative}
.combo-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 12px;text-align:left;transition:border-color .15s var(--ease)}
.combo-trigger:active{border-color:var(--accent)}
.combo-trigger .chev{transform:rotate(90deg);flex:none}
.combo-panel{margin-top:8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);
  box-shadow:var(--shadow);overflow:hidden}
.combo-panel .combo-search{border:0;border-bottom:1px solid var(--border);border-radius:0;background:var(--card)}
.combo-panel .combo-search:focus{outline:0;border-color:var(--border);border-bottom-color:var(--accent);border-bottom-width:2px}
.combo-list{max-height:44vh;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.combo-group{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px}
.combo-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;
  font:inherit;color:var(--text);background:transparent;border:0;border-radius:10px;padding:8px 10px;text-align:left;
  transition:background .15s var(--ease)}
.combo-opt.sel{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.combo-opt:active{background:var(--surface-2)}
@media (hover:hover){.combo-opt:hover{background:var(--surface)}}

/* Google Places autocomplete widget — best-effort match to the .f text inputs */
gmp-place-autocomplete{display:block;width:100%;font:inherit;
  --gmp-mat-color-surface:var(--surface);--gmp-mat-color-on-surface:var(--text);
  --gmp-mat-color-on-surface-variant:var(--dim);--gmp-mat-color-outline:var(--border);
  --gmp-mat-color-primary:var(--accent)}

/* login */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login{width:100%;max-width:340px;text-align:center}
.login .mark-lg{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff}
.login .field{text-align:left}
.login .btn{margin-top:16px}
.hint{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.7}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* Fix 1 — drop the double-tap-to-zoom wait on everything tappable (mobile).
   Fields already inherit the 16px body font, so iOS focus-zoom isn't the issue;
   this kills the native double-tap gesture delay on interactive, non-form elements. */
.btn,.btn-ghost,.ico,.iconbtn,.step,.seg button,.nav a,.card.apt,.undo-link,.toast-undo,
.combo-trigger,.combo-opt,[data-action]{touch-action:manipulation}

/* --- Apple-style hover (mouse-capable devices only; touch keeps the plain :active press) --- */
.btn,.btn-ghost,.ico,.iconbtn,.step{transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease),opacity .15s var(--ease)}
.btn-red{background:var(--red)}
.btn-green{background:var(--green)}
.btn-red:active{background:var(--red)}
.btn-green:active{background:var(--green)}
@media (hover:hover){
  .btn:hover{box-shadow:0 6px 16px rgba(20,16,45,.18)}
  .btn:hover:not(:active){transform:translateY(-1px) scale(1.015)}
  .btn-ghost:hover{box-shadow:var(--shadow)}
  .btn-ghost:hover:not(:active){transform:translateY(-1px) scale(1.015)}
  .btn-red:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--red) 40%,transparent)}
  .btn-green:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--green) 40%,transparent)}
  .ico:hover,.iconbtn:hover,.step:hover{opacity:.9}
  .ico:hover:not(:active),.iconbtn:hover:not(:active),.step:hover:not(:active){transform:translateY(-1px) scale(1.07)}
}

/* --- zone tabs: "this is your zone" indicator (Check in/out only) --- */
.seg button.zone-mine{box-shadow:inset 0 0 0 1.5px var(--green)}
.seg button.zone-other{box-shadow:inset 0 0 0 1.5px var(--orange)}

/* --- schedule table: colourful, cell-based grid --- */
.sched-wrap{overflow-x:auto}
.sched-table{border-collapse:separate;border-spacing:6px;width:100%;min-width:660px}
.sched-table th{color:var(--dim);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;text-align:center}
.sched-table th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2}
.sched-table td{font-size:13px;white-space:nowrap;text-align:center;padding:10px 10px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);transition:transform .12s var(--ease),box-shadow .12s var(--ease),border-color .12s var(--ease)}
.sched-table td.sched-name{position:sticky;left:0;z-index:1;text-align:left;font-weight:800;letter-spacing:-.01em;
  background:var(--surface-2);border-color:var(--border)}
.sched-cell.sched-work{background:color-mix(in srgb,var(--accent) 13%,var(--card));
  border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text);font-weight:700}
.sched-cell.sched-split{font-weight:700;border-color:color-mix(in srgb,var(--accent) 30%,transparent);
  background:linear-gradient(114deg,color-mix(in srgb,var(--accent) 15%,var(--card)) 0 47%,
    color-mix(in srgb,var(--blue) 15%,var(--card)) 53% 100%)}
.sched-cell.sched-free{background:var(--surface);color:var(--dim);font-style:italic}
.sched-cell.sched-empty{background:var(--surface);color:var(--dim)}
.sched-zone-row td{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left;border:0}
.sched-zone-row td .ico{color:var(--on-accent);border-color:color-mix(in srgb,#fff 35%,transparent);
  background:color-mix(in srgb,#fff 14%,transparent)}
.sched-night td{background:var(--surface-2);border-color:var(--border);font-weight:700}
.sched-night td.sched-name{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.sched-table td[data-action]{cursor:pointer}
@media (hover:hover){
  .sched-table td[data-action]:hover{border-color:var(--accent);box-shadow:0 5px 14px rgba(20,16,45,.14);transform:translateY(-1px)}
}

/* --- desktop / wide-viewport layout (mobile below 768 is untouched) --- */
@media (min-width:768px) and (max-width:1023px){
  #app{max-width:720px}
}
@media (min-width:1024px){
  #app{max-width:1140px;padding-bottom:32px;display:flex;flex-direction:column}
  .topbar{order:0;position:static}
  .nav{order:1;position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--border)}
  .nav-inner{max-width:none;justify-content:center;gap:8px}
  .nav a{flex:0 1 168px;flex-direction:row;justify-content:center;gap:7px;font-size:12px}
  main{order:2}
  .screen{padding:24px}
  .cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .cardgrid>.card{margin-top:0}
  .cardgrid>.empty{grid-column:1/-1}
  .stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .stack>.card{margin-top:0}
  dialog{max-width:600px}
  .sched-table{min-width:0}
}
@media (min-width:1440px){
  .cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<dialog id="dlg"></dialog>

<script>
"use strict";

/* ========================================================================
   CONFIG — edit accounts, greeting messages and the tax rate here
   ===================================================================== */

const TAX_RATE = 1.60;            // € per tax-paying guest per night
const TAX_FREE_AGE = 12;          // children this age and under don't pay (info only)

function seedAccounts() {
  return [
    { username: "maria", password: "maria123", name: "Maria", role: "worker" },
    { username: "luka",  password: "luka123",  name: "Luka",  role: "worker" },
    { username: "admin", password: "admin123", name: "Admin", role: "admin"  },
    // Schedule seed data (below) references these by username.
    { username: "anja",  password: "anja123",  name: "Anja",  role: "worker" },
    { username: "tea",   password: "tea123",   name: "Tea",   role: "worker" },
    { username: "toma",  password: "toma123",  name: "Toma",  role: "worker" },
    { username: "jasna", password: "jasna123", name: "Jasna", role: "worker" },
    { username: "fran",  password: "fran123",  name: "Fran",  role: "worker" },
    { username: "toni",  password: "toni123",  name: "Toni",  role: "worker" },
    { username: "armin", password: "armin123", name: "Armin", role: "worker" },
  ];
}
// ponytail: plaintext accounts in localStorage — fine for a no-backend prototype.
//           add real auth (server + hashed passwords) before production.

// WhatsApp message templates — token strings, not functions, so admins can edit them
// (Users → Message templates). db.templates overrides these; fall back here if unset.
// Three kinds only: checkin, checkout (also carries the checkout-day reminder), review.
// Every placeholder in TEMPLATE_PLACEHOLDERS works in every template — buildMessage()
// fills all five unconditionally. Old saved db.templates.checkoutReminder is ignored.
const DEFAULT_TEMPLATES = {
  checkin:
    "Hi, my name is {worker} and I am your host for staying in {town}. " +
    "I just wanted to know when are you arriving? Also if you have any questions you can just ask me.",
  checkout:
    "Hi {guest}, I hope you're enjoying your stay at {apartment}! Just a reminder that checkout is today at {time} — " +

const pad = n => String(n).padStart(2, "0");
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => fmtISO(new Date());
const addDays = (iso, n) => { const d = new Date(iso + "T00:00"); d.setDate(d.getDate() + n); return fmtISO(d); };

const WEEKDAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

const weekDates = weekStart => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));

const scheduleDayHeader = iso => `${WEEKDAY_NAMES[(new Date(iso + "T00:00").getDay() + 6) % 7]}, ${ddmm(iso)}.`;

function buildMessage(kind, b, apt) {
  const key = kind === "in" ? "checkin" : kind === "review" ? "review" : "checkout";

// transcribed from the reference weekly schedule (Mon..Sun), anchored to whatever week is "current" at seed time

  const d = i => addDays(weekStart, i);
  const row = (username, hours) => ({ username, days: Object.fromEntries(hours.map((h, i) => [d(i), h])) });
  return {
    zones: {

      ],

    night: Object.fromEntries(["toni", "fran", "jasna", "armin", "tea", "toma", "toni"].map((u, i) => [d(i), u])),
  };
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.schedule) parsed.schedule = {}; // upgrade older saved data that predates the Schedule feature
      return parsed;
    }
  } catch (e) { /* fall through to seed */ }
  const fresh = seedDB();
  saveDB(fresh);
  return fresh;
}
function saveDB(d) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(d)); } catch (e) { /* private mode / full: keep in memory */ }
}

function loadAccounts() {
  try {
    const raw = localStorage.getItem(ACCOUNTS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through to seed */ }
  const fresh = seedAccounts();
  saveAccounts(fresh);
  return fresh;
}

  const t = todayStr();
  return list.find(b => b.arrival_date <= t && b.departure_date >= t)
      || list.find(b => b.arrival_date > t)
      || null;
}

// read-only lifecycle tag for the All Bookings history view — derived, never stored
function bookingPhase(b) {
  if (b.status === "terminated") return "terminated";
  const t = todayStr();
  if (b.departed || b.departure_date < t) return "past";
  if (b.arrival_date > t) return "upcoming";
  return "current";
}

// Undo helpers for arrived / departed / clean. Pure: caller passes the linked apartment.
// Each action pushes a {a, at, by, prev} entry onto the target's _history; revert pops it
// and restores prev (the apartment status captured just before the action).
function revertBookingAction(b, apt) {
  const h = b._history || [];
  const last = h[h.length - 1];
  if (!last || (last.a !== "arrived" && last.a !== "departed")) return false;
  if (last.a === "arrived") b.arrived = false; else b.departed = false;
  if (last.prev != null && apt) apt.status = last.prev;
  h.pop();
  return true;
}
function revertAptClean(apt) {
  const h = apt._history || [];
  const last = h[h.length - 1];
  if (!last || last.a !== "cleaned") return false;
  apt.status = last.prev || "cleaning";
  h.pop();
  return true;
}

    .join("");

  const myZone = isAdmin() ? null : workerZone(session.username);
  const zoneTabs = [1, 2, 3].map(z => {
    const cls = [activeZone === z ? "on" : "", myZone ? (myZone === z ? "zone-mine" : "zone-other") : ""]
      .filter(Boolean).join(" ");

  }).join("");

  const ins  = db.bookings.filter(b => b.arrival_date === selectedDate && aptById(b.apartmentId)?.zone === activeZone);
  const outs = db.bookings.filter(b => b.departure_date === selectedDate && aptById(b.apartmentId)?.zone === activeZone);

function bookingCard(b, kind) {
  const apt = aptById(b.apartmentId) || {};
  const nights = nightsBetween(b.arrival_date, b.departure_date);
  const tax = touristTax(b.tax_paying_guest_count, nights);
  const rec = recDeposit(apt, b);
  const src = b.booking_source === "Agency" && b.agency_name ? `Agency · ${esc(b.agency_name)}` : esc(b.booking_source);

  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${apt.address || ""}, ${apt.town || ""}`)}`;
  const phone = digits(b.guest_phone);
  const terminated = b.status === "terminated";
  const cleaning = apt.status === "cleaning";
  const canAct = selectedDate <= todayStr();

  const statusPill = terminated
    ? `<span class="pill s-terminated">Terminated</span>`
    : `<span class="pill s-${apt.status || "ready"}">${apt.status || "—"}</span>`;

  // audit line stays as a trail; the inline undo link only while still safely reversible
  const lastH = (b._history || [])[(b._history || []).length - 1];
  let audit = "", undo = "";
  if (!terminated && lastH && (lastH.a === "arrived" || lastH.a === "departed")) {
    audit = `${lastH.a === "arrived" ? "Arrived" : "Departed"} · ${actionStamp(lastH)}`;
    if (bookingUndoable(b))
      undo = `<button class="undo-link" data-action="undo-action" data-target="booking" data-id="${b.id}">Undo ${lastH.a === "arrived" ? "arrival" : "departure"}</button>`;
  }
  const statusCol = `<div class="stat-col">${statusPill}` +
    `${audit ? `<div class="dim stat-note">${audit}</div>` : ""}${undo}</div>`;

  const waBtn = (k, icon, label) =>
    `<button class="ico" data-action="wa-msg" data-id="${b.id}" data-kind="${k}" aria-label="${label}"${phone ? "" : ' aria-disabled="true"'}>${icon}</button>`;

  let actionBtns = "";
  if (!terminated) {
    if (cleaning)  // apartment state, not a dated action — always offer the way back to "ready"
      actionBtns += `<button class="btn btn-green" style="margin-top:12px" data-action="mark-clean" data-id="${b.apartmentId}">Apartment is clean</button>`;
    else if (canAct && kind === "in" && !b.arrived)
      actionBtns += `<button class="btn" style="margin-top:12px" data-action="mark-arrived" data-id="${b.id}">Arrived</button>`;
    else if (canAct && kind === "out" && !b.departed)
      actionBtns += `<button class="btn" style="margin-top:12px" data-action="mark-departed" data-id="${b.id}">They left</button>`;
  }
  if (isAdmin() && !terminated && (kind === "in" ? !b.arrived : !b.departed))
    actionBtns += `<button class="btn btn-red" style="margin-top:8px" data-action="terminate-booking" data-id="${b.id}">Terminate</button>`;

  return `<div class="card" data-booking="${b.id}">
    <div class="between">
      <div>
        <div style="font-weight:700;font-size:17px;letter-spacing:-.015em">${esc(b.guest_name)}</div>
        <div class="dim" style="font-size:13px;margin-top:1px">${esc(apt.name || "—")} · ${src}</div>
      </div>
      ${statusCol}
    </div>
    ${b.guest_phone ? `<div class="row" style="gap:8px;margin-top:10px">
      <span style="font-weight:600">${esc(b.guest_phone)}</span>
      ${phone ? `<button class="ico" data-action="copy-phone" data-id="${b.id}" aria-label="Copy phone number">${I.copy}</button>` : ""}
    </div>` : ""}

    <div class="row2" style="margin-top:12px">
      <div><div class="metric-label">Guests</div><div style="font-weight:600">${b.guest_count}</div></div>
      <div><div class="metric-label">${nights} night${nights === 1 ? "" : "s"}</div>
        <div style="font-weight:600">${prettyDate(b.arrival_date)} ${I.arrow} ${prettyDate(b.departure_date)}</div></div>
    </div>

    <div class="card muted-card" style="margin-top:12px">
      <div class="between">
        <div>
          <div class="metric-label">Tourist tax due</div>
          <div class="metric" data-tax-total>${eur(tax)}</div>
          <div class="dim" style="font-size:12px;margin-top:2px">€${TAX_RATE.toFixed(2)} × pax × ${nights} night${nights === 1 ? "" : "s"} · over-${TAX_FREE_AGE}s only</div>
        </div>
        <div style="width:96px">
          <label class="f">Tax-paying</label>
          <input type="number" min="0" step="1" value="${b.tax_paying_guest_count}"
                 data-field="tax_paying_guest_count" data-id="${b.id}" data-nights="${nights}" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="row2" style="margin-top:12px">
      <div class="field">
        <label class="f">Recommended deposit</label>
        <input value="${eur0(rec)}" disabled>
      </div>
      <div class="field">
        <label class="f">Deposit taken (€)</label>
        <input type="number" min="0" step="1" value="${b.actual_deposit_taken}"
               data-field="actual_deposit_taken" data-id="${b.id}" inputmode="numeric">
      </div>
    </div>

    <div class="field" style="margin-top:10px">
      <label class="f">Notes</label>
      <textarea rows="2" data-field="notes" data-id="${b.id}" placeholder="Notes about the guests…">${esc(b.notes)}</textarea>
    </div>

    <div class="acts" style="margin-top:12px">
      <a class="ico" href="${mapsUrl}" target="_blank" rel="noopener" aria-label="Open in Google Maps">${I.pin}</a>
      ${waBtn("in", I.chat, "Send check-in message")}
      ${waBtn("out", I.bell, "Send check-out message")}

}

function scheduleRow(zone, rowIndex, row, dates) {
  const name = accountName(row.username) || "Unassigned";

/* ========================================================================
   EVENTS  (delegated on document — survives re-render, reaches <dialog>)
   ===================================================================== */

function persistBooking(id, patch) {
  const b = db.bookings.find(x => x.id === id);
  if (!b) return;
  Object.assign(b, patch);
  saveDB(db);
}

// append an audit/undo entry to a booking or apartment (see revertBookingAction / revertAptClean)
function recordAction(target, action, prevAptStatus) {
  const h = (target._history = target._history || []);
  h.push({ a: action, at: Date.now(), by: (session && session.name) || "", prev: prevAptStatus });
  if (h.length > 8) h.splice(0, h.length - 8);   // only the last entry is ever read; keep a short tail
}

// is the most recent logged action still safely reversible? (shared by the inline links and the toast)
function bookingUndoable(b) {
  const last = (b._history || [])[(b._history || []).length - 1];
  if (!last || b.status === "terminated") return false;
  if (last.a === "arrived")  return !!b.arrived && !b.departed;
  if (last.a === "departed") return !!b.departed && aptById(b.apartmentId)?.status === "cleaning";
  return false;
}
function aptCleanUndoable(a) {
  const last = (a._history || [])[(a._history || []).length - 1];
  return !!last && last.a === "cleaned" && a.status === "ready";
}

/* ---- undo toast (lives in #toast, outside #app, so render() doesn't wipe it) ---- */
let _toastUndo = null, _toastTimer = null;

// re-looks-up by id at click time and re-checks reversibility, so a follow-up action
// inside the 7s window can't make the toast's Undo restore a now-stale status
function toastWithUndo(msg, targetKind, id) {
  showToast(msg, () => {
    if (targetKind === "booking") {
      const b = db.bookings.find(x => x.id === id);
      if (b && bookingUndoable(b)) revertBookingAction(b, aptById(b.apartmentId));
    } else {
      const apt = aptById(id);
      if (apt && aptCleanUndoable(apt)) revertAptClean(apt);
    }
    saveDB(db); render();
  });
}
function showToast(msg, undoFn) {
  const host = $("#toast");
  if (!host) return;
  _toastUndo = undoFn || null;
  host.innerHTML = `<div class="toast fade">
    <span>${esc(msg)}</span>
    ${undoFn ? `<button class="toast-undo" data-action="toast-undo">Undo</button>` : ""}
  </div>`;
  host.hidden = false;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(hideToast, 7000);
}
function hideToast() {
  clearTimeout(_toastTimer);
  _toastUndo = null;
  const host = $("#toast");
  if (!host || host.hidden) return;
  const card = host.firstElementChild;
  if (card) card.classList.add("out");
  setTimeout(() => { host.hidden = true; host.innerHTML = ""; }, 170);
}

/* ---- copy guest phone to clipboard (Fix 4) ---- */
function copyPhone(text) {
  const ok = () => showToast("Phone number copied");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, () => { if (legacyCopy(text)) ok(); });
  } else if (legacyCopy(text)) ok();
}
function legacyCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.select();
    const done = document.execCommand("copy");
    ta.remove();
    return done;
  } catch (e) { return false; }
}

/* ---- searchable apartment picker list (Fix 3) ---- */
function aptComboListHtml(query, selectedId) {
  const q = String(query || "").trim().toLowerCase();
  const match = db.apartments.filter(a => !q || String(a.name).toLowerCase().includes(q));
  const group = (title, list) => list.length
    ? `<div class="combo-group">${title}</div>` + list.map(a =>
        `<button type="button" class="combo-opt${a.id === selectedId ? " sel" : ""}"
          data-action="apt-combo-pick" data-id="${a.id}" data-name="${esc(a.name)}">
          <span>${esc(a.name)}</span>${a.id === selectedId ? I.check : ""}</button>`).join("")
    : "";
  const seen = new Set();
  let html = [1, 2, 3].map(z => {
    const list = match.filter(a => Number(a.zone) === z);
    list.forEach(a => seen.add(a.id));
    return group("Zone " + z, list);
  }).join("");
  html += group("Other", match.filter(a => !seen.has(a.id)));   // never hide an apartment with an odd/missing zone
  return html || `<div class="empty" style="padding:18px 10px">No apartments match.</div>`;
}

/* ---- Google Places address autocomplete (Fix 2 — optional; needs a key, see <head>) ---- */
let _gmapsPromise = null;
function loadGoogleMaps() {
  if (_gmapsPromise) return _gmapsPromise;
  const key = window.GOOGLE_MAPS_API_KEY;
  if (!key || key === "YOUR_GOOGLE_MAPS_API_KEY_HERE")
    return (_gmapsPromise = Promise.reject(new Error("no Google Maps API key")));
  _gmapsPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) +
            "&v=weekly&libraries=places&loading=async";
    s.async = true;
    s.onload = resolve;
    s.onerror = () => { _gmapsPromise = null; reject(new Error("Google Maps failed to load")); };
    document.head.appendChild(s);
  });
  return _gmapsPromise;
}
function setHidden(name, val) {
  const el = dlg.querySelector('input[name="' + name + '"]');
  if (el) el.value = val;
}
// Called right after the apartment dialog opens (its <input> is rendered fresh each time).
// On any failure the plain text input is left exactly as-is.
function initAddressAutocomplete() {
  const input = dlg.querySelector('input[name="address"]');
  if (!input || input.dataset.acReady) return;
  loadGoogleMaps()
    .then(() => google.maps.importLibrary("places"))
    .then(() => {
      if (!dlg.open || !dlg.contains(input)) return;
      const ac = new google.maps.places.PlaceAutocompleteElement();
      ac.className = "addr-ac";
      (input.closest("label.f") || input).after(ac);
      input.hidden = true;
      input.required = false;          // hidden inputs are barred from constraint validation — see submit handler
      input.dataset.acReady = "1";
      const pick = async ev => {
        const pred = ev.placePrediction || (ev.detail && ev.detail.placePrediction);
        const place = pred ? pred.toPlace() : (ev.place || (ev.detail && ev.detail.place));
        if (!place) return;
        try { await place.fetchFields({ fields: ["formattedAddress", "location"] }); }
        catch (e) { return; }
        input.value = place.formattedAddress || input.value;
        const loc = place.location;
        if (loc) {
          setHidden("lat", typeof loc.lat === "function" ? loc.lat() : loc.lat);
          setHidden("lng", typeof loc.lng === "function" ? loc.lng() : loc.lng);
        }
        const err = dlg.querySelector(".err");
        if (err) err.textContent = "";
      };
      ac.addEventListener("gmp-select", pick);
      ac.addEventListener("gmp-placeselect", pick);   // older widget builds
      // keep whatever the user typed even if they never pick a suggestion, so Save doesn't reject a valid address
      ac.addEventListener("input", () => {
        const typed = (ac.value != null ? ac.value : (ac.querySelector("input") || {}).value || "").trim();
        if (typed) { input.value = typed; const err = dlg.querySelector(".err"); if (err) err.textContent = ""; }
      });
    })
    .catch(() => { /* no key / offline / blocked — the plain text input stays */ });
}

// keep the live session (topbar name, isAdmin() checks) in sync when an admin edits their own account
function syncSelfSession(acc) {
  if (!session || acc.username !== session.username) return;
  session = { username: acc.username, name: acc.name, role: acc.role };
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
}

document.addEventListener("click", e => {
  // collapse an open apartment-combo panel on any click outside it
  if (dlg.open && !e.target.closest("[data-combo]")) {
    const p = dlg.querySelector(".combo-panel:not([hidden])");
    if (p) p.hidden = true;
  }

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;

  if (el.tagName === "A") e.preventDefault?.();

  switch (a) {
    case "nav":
      route = el.dataset.route; render(); break;
    case "theme":
      toggleTheme(); break;
    case "logout":
      session = null; route = "checkinout"; try { localStorage.removeItem(SESSION_KEY); } catch (e) {} render(); break;
    case "reldate":
      selectedDate = addDays(todayStr(), { yesterday: -1, today: 0, tomorrow: 1 }[el.dataset.rel]); render(); break;
    case "stepdate":
      selectedDate = addDays(selectedDate, +el.dataset.step); render(); break;
    case "zone":
      activeZone = +el.dataset.zone; render(); break;
    case "toggle-apt": {
      if (e.target.closest("select, textarea, input")) break;   // let form controls work without collapsing the card
      const id = el.dataset.id;
      openApts.has(id) ? openApts.delete(id) : openApts.add(id);
      el.classList.toggle("open");
      break;
    }
    case "toggle-history": {
      const id = el.dataset.id;
      openHistory.has(id) ? openHistory.delete(id) : openHistory.add(id);
      el.classList.toggle("open");
      break;
    }
    case "undo-action": {
      if (el.dataset.target === "booking") {
        const b = db.bookings.find(x => x.id === el.dataset.id);
        if (b && bookingUndoable(b)) revertBookingAction(b, aptById(b.apartmentId));
      } else {
        const apt = aptById(el.dataset.id);
        if (apt && aptCleanUndoable(apt)) revertAptClean(apt);
      }
      saveDB(db); hideToast(); render();
      break;
    }
    case "toast-undo":
      if (_toastUndo) _toastUndo();
      hideToast();
      break;
    case "add-booking":   openBookingDialog(); break;
    case "add-apartment": openApartmentDialog(); break;
    case "edit-apartment": openApartmentDialog(el.dataset.id); break;
    case "delete-apartment": {
      const n = db.bookings.filter(b => b.apartmentId === el.dataset.id).length;
      confirmDialog("confirm-delete-apt", el.dataset.id,
        n ? `Delete this apartment and its ${n} booking${n === 1 ? "" : "s"}?` : "Delete this apartment?");
      break;
    }
    case "add-user":      openNewUserDialog(); break;
    case "edit-user":     openEditUserDialog(el.dataset.id); break;
    case "edit-templates": openTemplatesDialog(); break;
    case "mark-arrived":  openConfirmAction("confirm-arrived", el.dataset.id); break;
    case "mark-departed": openConfirmAction("confirm-departed", el.dataset.id); break;
    case "mark-clean":    openConfirmAction("confirm-clean", el.dataset.id); break;
    case "terminate-booking": openConfirmAction("confirm-terminate", el.dataset.id); break;
    case "wa-msg":        openWaDialog(el.dataset.id, el.dataset.kind); break;
    case "wa-send": {
      const ta = dlg.querySelector('[name="wa_text"]');
      const ph = el.dataset.phone;
      if (ta && ph) window.open(`https://wa.me/${ph}?text=${encodeURIComponent(ta.value)}`, "_blank", "noopener");
      dlg.close("sent");
      break;
    }
    case "promote-user": {
      const acc = ACCOUNTS.find(x => x.username === el.dataset.id);
      if (acc) confirmDialog("confirm-promote", acc.username, `Are you sure you want to promote ${acc.name} to admin?`);
      break;
    }
    case "demote-user": {
      const acc = ACCOUNTS.find(x => x.username === el.dataset.id);
      if (acc) confirmDialog("confirm-demote", acc.username, `Are you sure you want to demote ${acc.name} to worker?`);
      break;
    }
    case "sched-thisweek": scheduleWeekStart = mondayOf(todayStr()); render(); break;
    case "sched-stepweek": scheduleWeekStart = addDays(scheduleWeekStart, +el.dataset.step * 7); render(); break;
    case "add-sched-row": {
      const z = +el.dataset.zone;
      openScheduleWorkerDialog(z, getScheduleWeek(scheduleWeekStart).zones[z].length);
      break;
    }
    case "edit-sched-worker": openScheduleWorkerDialog(+el.dataset.zone, +el.dataset.row); break;
    case "edit-sched-night":  openScheduleNightDialog(el.dataset.date); break;
    case "edit-sched-hours":  openScheduleHoursDialog(+el.dataset.zone, +el.dataset.row, el.dataset.date); break;
    case "remove-sched-row": {
      const z = +el.dataset.zone, r = +el.dataset.row;
      const worker = getScheduleWeek(scheduleWeekStart).zones[z][r];
      const label = accountName(worker?.username) || "this row";
      confirmDialog("confirm-remove-sched-row", `${z}|${r}`, `Remove ${label} from Zone ${z} this week?`);
      break;
    }
    case "sched-preset": {
      const [z, r, d] = dlg.querySelector("form").dataset.id.split("|");
      applyScheduleHours(+z, +r, d, el.dataset.value);
      // explicit non-"ok" value: dlg.close() with no arg leaves returnValue at whatever a PRIOR
      // dialog's Save last set it to, which would make the close listener re-process this dialog
      dlg.close("applied");
      break;
    }
    case "dlg-cancel":    dlg.close("cancel"); break;

    case "copy-phone": {
      const b = db.bookings.find(x => x.id === el.dataset.id);
      if (b && b.guest_phone) copyPhone(b.guest_phone);
      break;
    }
    case "apt-combo-open": {
      const combo = el.closest("[data-combo]");
      const panel = combo.querySelector(".combo-panel");
      panel.hidden = !panel.hidden;
      if (!panel.hidden) {
        const search = panel.querySelector(".combo-search");
        search.value = "";
        combo.querySelector("[data-combo-list]").innerHTML =
          aptComboListHtml("", combo.querySelector('[name="apartmentId"]').value);
        search.focus();

    }

      const combo = el.closest("[data-combo]");
      combo.querySelector('[name="apartmentId"]').value = el.dataset.id;
      const label = combo.querySelector("[data-combo-label]");
      label.textContent = el.dataset.name;
      label.classList.remove("dim");
      combo.querySelector(".combo-panel").hidden = true;
      const err = combo.closest("form").querySelector(".err");
      if (err) err.textContent = "";
      break;
    }
  }
});

document.addEventListener("submit", e => {
  const form = e.target;
  if (form.dataset.form === "login") {
    e.preventDefault();
    const fd = new FormData(form);
    const u = String(fd.get("username")).trim().toLowerCase();
    const p = String(fd.get("password"));
    const acc = ACCOUNTS.find(x => x.username === u && x.password === p);
    if (!acc) { form.querySelector(".err").textContent = "Wrong username or password."; return; }
    session = { username: acc.username, name: acc.name, role: acc.role };
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
    const wz = acc.role === "worker" ? workerZone(acc.username) : null;
    if (wz) activeZone = wz;
    render();
  } else if (form.dataset.form === "new-user" && e.submitter?.value === "ok") {
    const username = String(new FormData(form).get("username") || "").trim().toLowerCase();
    const taken = !username || ACCOUNTS.some(x => x.username === username);
    if (taken) {
      e.preventDefault();
      form.querySelector(".err").textContent = username ? "That username is already taken." : "Username is required.";
    }
  } else if (form.dataset.form === "booking" && e.submitter?.value === "ok") {
    // the apartment picker is a custom combobox (hidden input) — validate it here
    if (!new FormData(form).get("apartmentId")) {
      e.preventDefault();
      form.querySelector(".err").textContent = "Please choose an apartment.";
    }
  } else if (form.dataset.form === "apartment" && e.submitter?.value === "ok") {
    // native `required` is dropped from #address once the Places widget mounts — re-check here
    if (!String(new FormData(form).get("address") || "").trim()) {
      e.preventDefault();
      form.querySelector(".err").textContent = "Address is required.";
    }
  }
});

// dialog result
dlg.addEventListener("close", () => {
  const form = dlg.querySelector("form");
  if (dlg.returnValue !== "ok" || !form) return;
  const fd = new FormData(form);
  const num = (k, d = 0) => { const n = Number(fd.get(k)); return Number.isFinite(n) ? n : d; };

  if (form.dataset.form === "booking") {
    db.bookings.push({
      id: nextId(),
      apartmentId: fd.get("apartmentId"),
      guest_name: String(fd.get("guest_name")).trim(),
      guest_phone: String(fd.get("guest_phone")).trim(),
      booking_source: fd.get("booking_source"),
      agency_name: fd.get("booking_source") === "Agency" ? String(fd.get("agency_name") || "").trim() : "",
      guest_count: Math.max(1, num("guest_count", 1)),
      tax_paying_guest_count: Math.max(0, num("tax_paying_guest_count", 0)),
      arrival_date: fd.get("arrival_date"),
      departure_date: fd.get("departure_date"),
      actual_deposit_taken: Math.max(0, num("actual_deposit_taken", 0)),
      notes: String(fd.get("notes") || "").trim(),
      arrived: false, departed: false,
    });
  } else if (form.dataset.form === "apartment") {
    const patch = {
      name: String(fd.get("name")).trim(),
      address: String(fd.get("address")).trim(),
      town: String(fd.get("town") || "Novalja").trim(),
      zone: Math.min(3, Math.max(1, num("zone", 1))),
      max_guests: Math.max(1, num("max_guests", 2)),
      deposit_per_person: Math.max(0, num("deposit_per_person", 15)),
      status: fd.get("status") || "ready",
    };
    // optional coords from Google Places — only written when actually set (never clobbers)
    const latRaw = String(fd.get("lat") || "").trim(), lngRaw = String(fd.get("lng") || "").trim();
    if (latRaw && Number.isFinite(+latRaw)) patch.lat = +latRaw;
    if (lngRaw && Number.isFinite(+lngRaw)) patch.lng = +lngRaw;
    const existing = form.dataset.id && aptById(form.dataset.id);
    if (existing) Object.assign(existing, patch);
    else db.apartments.push({ id: nextId(), ...patch });
  } else if (form.dataset.form === "confirm-delete-apt") {
    db.bookings = db.bookings.filter(b => b.apartmentId !== form.dataset.id);
    db.apartments = db.apartments.filter(a => a.id !== form.dataset.id);
    openApts.delete(form.dataset.id);
  } else if (form.dataset.form === "confirm-clean") {
    const apt = aptById(form.dataset.id);
    if (apt && apt.status === "cleaning") {
      recordAction(apt, "cleaned", apt.status);
      apt.status = "ready";
      toastWithUndo(`${apt.name} marked clean`, "apt", apt.id);
    }
  } else if (form.dataset.form === "confirm-terminate") {
    const b = db.bookings.find(x => x.id === form.dataset.id);
    if (b) {
      b.status = "terminated";
      const apt = aptById(b.apartmentId);
      // no one stayed → back to ready, not cleaning; leave alone if another live booking holds it
      const otherActive = db.bookings.some(x =>
        x.apartmentId === b.apartmentId && x.id !== b.id && x.arrived && !x.departed && x.status !== "terminated");
      if (apt && apt.status === "occupied" && !otherActive) apt.status = "ready";
    }
  } else if (form.dataset.form === "templates") {
    db.templates = {};
    for (const k of Object.keys(DEFAULT_TEMPLATES))
      db.templates[k] = String(fd.get(k) || "").trim() || DEFAULT_TEMPLATES[k];
  } else if (form.dataset.form === "confirm-arrived") {
    const b = db.bookings.find(x => x.id === form.dataset.id);
    if (b) {
      const apt = aptById(b.apartmentId);
      recordAction(b, "arrived", apt ? apt.status : null);
      b.arrived = true;
      if (apt) apt.status = "occupied";
      toastWithUndo(`Marked ${b.guest_name} as arrived`, "booking", b.id);
    }
  } else if (form.dataset.form === "confirm-departed") {
    const b = db.bookings.find(x => x.id === form.dataset.id);
    if (b) {
      const apt = aptById(b.apartmentId);
      // don't downgrade status if a same-day turnover guest already checked in after this departure
      const stillOccupied = db.bookings.some(x => x.apartmentId === b.apartmentId && x.id !== b.id && x.arrived && !x.departed);
      recordAction(b, "departed", apt ? apt.status : null);
      b.departed = true;
      if (apt && !stillOccupied) apt.status = "cleaning";
      toastWithUndo(`Marked ${b.guest_name} as departed`, "booking", b.id);
    }
  } else if (form.dataset.form === "new-user") {
    const username = String(fd.get("username") || "").trim().toLowerCase();
    if (username && !ACCOUNTS.some(x => x.username === username)) {
      ACCOUNTS.push({
        username,
        password: String(fd.get("password") || "").trim(),
        name: String(fd.get("name") || "").trim(),
        role: fd.get("role") === "admin" ? "admin" : "worker",
      });
      saveAccounts(ACCOUNTS);
    }
  } else if (form.dataset.form === "edit-user") {
    const acc = ACCOUNTS.find(x => x.username === form.dataset.id);
    if (acc) {
      acc.name = String(fd.get("name") || "").trim() || acc.name;
      acc.password = String(fd.get("password") || "").trim() || acc.password;
      saveAccounts(ACCOUNTS);
      syncSelfSession(acc);
    }
  } else if (form.dataset.form === "confirm-promote") {
    const acc = ACCOUNTS.find(x => x.username === form.dataset.id);
    if (acc) { acc.role = "admin"; saveAccounts(ACCOUNTS); syncSelfSession(acc); }
  } else if (form.dataset.form === "confirm-demote") {
    const acc = ACCOUNTS.find(x => x.username === form.dataset.id);
    if (acc) { acc.role = "worker"; saveAccounts(ACCOUNTS); syncSelfSession(acc); }
  } else if (form.dataset.form === "sched-assign-row") {
    const [zone, rowIndex] = form.dataset.id.split("|").map(Number);
    const week = ensureScheduleWeek(scheduleWeekStart);
    if (!week.zones[zone][rowIndex]) week.zones[zone][rowIndex] = { username: "", days: {} };
    week.zones[zone][rowIndex].username = fd.get("username");
  } else if (form.dataset.form === "sched-assign-night") {
    ensureScheduleWeek(scheduleWeekStart).night[form.dataset.id] = fd.get("username") || "";
  } else if (form.dataset.form === "sched-hours") {
    const [zone, rowIndex, date] = form.dataset.id.split("|");
    const custom = String(fd.get("custom") || "").trim();
    if (custom) applyScheduleHours(+zone, +rowIndex, date, custom, false);
  } else if (form.dataset.form === "confirm-remove-sched-row") {
    const [zone, rowIndex] = form.dataset.id.split("|").map(Number);
    ensureScheduleWeek(scheduleWeekStart).zones[zone].splice(rowIndex, 1);
  }
  const dbForms = ["booking", "apartment", "confirm-delete-apt", "confirm-clean", "confirm-terminate",
    "templates", "confirm-arrived", "confirm-departed",
    "sched-assign-row", "sched-assign-night", "sched-hours", "confirm-remove-sched-row"];
  if (dbForms.includes(form.dataset.form)) saveDB(db);
  render();
});

/* ---- dialogs ---- */

function dialogShell(kind, title, body, { id, menu } = {}) {
  dlg.innerHTML = `<form method="dialog" class="dform" data-form="${kind}"${id ? ` data-id="${esc(id)}"` : ""}>
    <h3>${title}</h3>
    ${body}
    <menu>${menu || `
      <button type="button" class="btn-ghost" data-action="dlg-cancel">Cancel</button>
      <button value="ok" class="btn">Save</button>`}
    </menu>
  </form>`;
  dlg.showModal();
  // some browsers don't clear returnValue on showModal(); without this, dismissing a
  // dialog with Escape after any previous Save would still read "ok" and re-run the action.
  dlg.returnValue = "";
}

function confirmDialog(kind, id, message) {
  dialogShell(kind, esc(message), "", {
    id,
    menu: `
      <button type="button" class="btn btn-red" data-action="dlg-cancel">Cancel</button>
      <button value="ok" class="btn btn-green">Confirm</button>`,
  });
}

/* ---- richer confirmations for arrived / departed / clean / terminate ---- */

function bookingSummaryRows(b, withNotes) {
  const apt = aptById(b.apartmentId) || {};
  const nights = nightsBetween(b.arrival_date, b.departure_date);
  const src = b.booking_source === "Agency" && b.agency_name ? `Agency · ${esc(b.agency_name)}` : esc(b.booking_source);
  const notes = withNotes && b.notes
    ? `<div style="margin-top:8px"><div class="metric-label">Notes</div>
         <div class="dim" style="font-size:13px;margin-top:2px">${esc(b.notes)}</div></div>` : "";
  return `<div class="card muted-card" style="margin-top:4px">
    <div class="kv"><span>Apartment</span><span>${esc(apt.name || "—")}</span></div>
    <div class="kv"><span>Address</span><span>${esc(apt.address || "—")}</span></div>
    <div class="kv"><span>Guest</span><span>${esc(b.guest_name)}</span></div>
    <div class="kv"><span>Source</span><span>${src}</span></div>
    <div class="kv"><span>Guests</span><span>${b.guest_count}</span></div>
    <div class="kv"><span>Stay</span><span>${prettyDate(b.arrival_date)} ${I.arrow} ${prettyDate(b.departure_date)} · ${nights}n</span></div>
    <div class="kv"><span>Tax-paying · tax</span><span>${b.tax_paying_guest_count} · ${eur(touristTax(b.tax_paying_guest_count, nights))}</span></div>
    <div class="kv"><span>Deposit taken</span><span>${eur0(b.actual_deposit_taken)}</span></div>
    ${notes}
  </div>`;
}

// kind: confirm-arrived | confirm-departed | confirm-clean | confirm-terminate
function openConfirmAction(kind, id) {
  let title, body, confirmLabel, danger = false;

  if (kind === "confirm-clean") {
    const a = aptById(id);
    if (!a) return;
    const dep = db.bookings
      .filter(x => x.apartmentId === id && x.departed)
      .sort((x, y) => (x.departure_date < y.departure_date ? 1 : -1))[0];
    title = "Mark apartment clean?";
    confirmLabel = "Confirm clean";
    body = `<div class="card muted-card" style="margin-top:4px">
      <div class="kv"><span>Apartment</span><span>${esc(a.name)}</span></div>
      <div class="kv"><span>Address</span><span>${esc(a.address)}</span></div>
      <div class="kv"><span>Zone</span><span>${a.zone}</span></div>
      ${dep ? `<div class="kv"><span>Last guest</span><span>${esc(dep.guest_name)}</span></div>
               <div class="kv"><span>Departed</span><span>${prettyDate(dep.departure_date)}</span></div>` : ""}
    </div>`;
  } else {
    const b = db.bookings.find(x => x.id === id);
    if (!b) return;
    if (kind === "confirm-arrived") {
      title = "Confirm arrival?"; confirmLabel = "Confirm arrival";
      body = bookingSummaryRows(b);
    } else if (kind === "confirm-departed") {
      title = "Confirm departure?"; confirmLabel = "Confirm departure";
      body = bookingSummaryRows(b, true);
    } else { // confirm-terminate
      title = "Terminate this booking?"; confirmLabel = "Terminate booking"; danger = true;
      const arrivedWarn = b.arrived && !b.departed
        ? `<p style="font-size:12px;margin-top:10px;color:var(--red);font-weight:600">This guest has already checked in — terminating frees the apartment.</p>` : "";
      body = bookingSummaryRows(b) + arrivedWarn +
        `<p class="dim" style="font-size:12px;margin-top:10px">The booking is cancelled and the apartment stays available. This can't be undone.</p>`;
    }
  }

  dialogShell(kind, title, body, {
    id,
    menu: `
      <button type="button" class="btn-ghost" data-action="dlg-cancel">Cancel</button>
      <button value="ok" class="btn ${danger ? "btn-red" : "btn-green"}">${esc(confirmLabel)}</button>`,
  });
}

function applyScheduleHours(zone, rowIndex, date, value, standalone = true) {
  const week = ensureScheduleWeek(scheduleWeekStart);
  const row = week.zones[zone][rowIndex];
  if (!row) return;
  row.days[date] = value;
  if (standalone) { saveDB(db); render(); }
}

function workerOptions(selected) {
  return ACCOUNTS.filter(a => a.role === "worker")
    .map(w => `<option value="${esc(w.username)}" ${w.username === selected ? "selected" : ""}>${esc(w.name)}</option>`).join("");
}

  const current = getScheduleWeek(scheduleWeekStart).zones[zone][rowIndex]?.username || "";

/* ---- theme ---- */

function toggleTheme() {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  render();
}
(function initTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
})();

/* ========================================================================
   SELF-CHECK  (runs once at startup; logs to console)
   ===================================================================== */

(function selfTest() {
  const ok = (cond, label) => (cond ? console.log("%c✓ " + label, "color:#12b981")
                                     : console.error("✗ " + label));
  const near = (a, b) => Math.abs(a - b) < 1e-9;
  ok(nightsBetween("2026-09-08", "2026-09-11") === 3, "nights: 8→11 Sep = 3");
  ok(nightsBetween("2026-09-08", "2026-09-08") === 0, "nights: same day = 0");
  ok(near(touristTax(3, 4), 19.2), "tax: 3 pax × 4 nights = €19.20");
  ok(touristTax(0, 5) === 0, "tax: 0 tax-paying guests = €0");
  ok(eur(touristTax(3, 4)) === "€19.20", "tax formats to €19.20");
  ok(recDeposit({ deposit_per_person: 15 }, { guest_count: 4 }) === 60, "deposit: €15 × 4 = €60");
  ok(fillTemplate("Hi {guest}, checkout at {time}.", { guest: "Luka", time: "9:00" })
     === "Hi Luka, checkout at 9:00.", "template: fills {guest} and {time}");
  ok(fillTemplate("Keep {unknown}", {}) === "Keep {unknown}", "template: leaves unknown tokens intact");

  // Feature 3 — three template kinds, no reminder anywhere, every token substitutable
  ok(!("checkoutReminder" in DEFAULT_TEMPLATES) && Object.keys(DEFAULT_TEMPLATES).join() === "checkin,checkout,review"
     && !("checkoutReminder" in TEMPLATE_LABELS), "templates: only checkin/checkout/review remain");
  {
    const m = buildMessage("review", { guest_name: "Ana Perić" }, { name: "Sea Breeze Studio", town: "Novalja" });
    ok(m.includes("Ana Perić") && m.includes("Sea Breeze Studio") && !m.includes("{"),
       "buildMessage('review'): review template, all tokens filled");
    ok(DEFAULT_TEMPLATES.checkout.includes("{time}") && DEFAULT_TEMPLATES.checkout.toLowerCase().includes("rubbish"),
       "default check-out template folds in the checkout-day reminder");
  }

  // Feature 2 — lifecycle phase derivation
  ok(bookingPhase({ status: "terminated", arrival_date: "2020-01-01", departure_date: "2020-01-02" }) === "terminated",
     "phase: terminated wins");
  ok(bookingPhase({ arrival_date: addDays(todayStr(), 3), departure_date: addDays(todayStr(), 6) }) === "upcoming",
     "phase: future booking = upcoming");
  ok(bookingPhase({ departed: true, arrival_date: addDays(todayStr(), -5), departure_date: addDays(todayStr(), -1) }) === "past",
     "phase: departed = past");
  ok(bookingPhase({ arrived: true, departed: false, arrival_date: addDays(todayStr(), -1), departure_date: addDays(todayStr(), 2) }) === "current",
     "phase: staying now = current");

  // Feature 1 — undo helpers revert the last action and restore prior apartment status
  {
    const apt = { status: "occupied", _history: [] };
    const bk = { arrived: true, departed: false, _history: [{ a: "arrived", at: 1, by: "X", prev: "ready" }] };
    ok(revertBookingAction(bk, apt) && bk.arrived === false && apt.status === "ready" && bk._history.length === 0,
       "undo arrival: flips arrived + restores apt status");
    const apt2 = { status: "ready", _history: [{ a: "cleaned", at: 1, by: "X", prev: "cleaning" }] };
    ok(revertAptClean(apt2) && apt2.status === "cleaning" && apt2._history.length === 0,
       "undo clean: apartment back to cleaning");
    ok(revertBookingAction({ _history: [] }, {}) === false, "undo: no-op when no history");
    // recordAction keeps only a short tail
    const cap = { _history: [] };
    for (let i = 0; i < 20; i++) recordAction(cap, "cleaned", "cleaning");
    ok(cap._history.length === 8, "recordAction: _history capped at 8 entries");
    // aptCleanUndoable: only while apt is still 'ready' with a trailing 'cleaned'
    ok(aptCleanUndoable({ status: "ready", _history: [{ a: "cleaned" }] }) === true, "aptCleanUndoable: ready + cleaned");
    ok(aptCleanUndoable({ status: "occupied", _history: [{ a: "cleaned" }] }) === false, "aptCleanUndoable: not once moved on");
  }

  // Fix 3 — searchable apartment picker: filters by name, groups by zone, marks selection
  {
    const s = db.apartments[0];
    if (s) {
      const html = aptComboListHtml(s.name.slice(0, 3).toLowerCase(), s.id);
      ok(html.includes(esc(s.name)) && html.includes("Zone " + s.zone) && html.includes("combo-opt sel"),
         "aptComboList: name filter + zone header + selected row");
    }
    ok(aptComboListHtml("zzz-no-such-apartment", "").includes("No apartments match"),
       "aptComboList: empty state when nothing matches");
  }
})();

render();
</script>
